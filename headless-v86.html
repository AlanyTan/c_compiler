<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V86 Arch Linux Console</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f0f0f0;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            font-weight: bold;
        }
        .status.loading { background: #e3f2fd; color: #1976d2; }
        .status.success { background: #e8f5e8; color: #2e7d32; }
        .status.error { background: #ffebee; color: #c62828; }
        #serial {
            width: 100%;
            height: 400px;
            background: #000;
            color: #fff; /* Default white for readability */
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #333;
            white-space: pre-wrap;
            overflow-y: auto;
            resize: none;
        }
        /* ANSI Colors */
        .ansi-bold { font-weight: bold; }
        .ansi-black { color: #000000; }
        .ansi-red { color: #cd0000; }
        .ansi-green { color: #00cd00; }
        .ansi-yellow { color: #cdcd00; }
        .ansi-blue { color: #0000ee; }
        .ansi-magenta { color: #cd00cd; }
        .ansi-cyan { color: #00cdcd; }
        .ansi-white { color: #e5e5e5; }
        /* Bright colors */
        .ansi-bright-black { color: #7f7f7f; }
        .ansi-bright-red { color: #ff0000; }
        .ansi-bright-green { color: #00ff00; }
        .ansi-bright-yellow { color: #ffff00; }
        .ansi-bright-blue { color: #5c5cff; }
        .ansi-bright-magenta { color: #ff00ff; }
        .ansi-bright-cyan { color: #00ffff; }
        .ansi-bright-white { color: #ffffff; }
        /* Specific overrides for serial div */
        #serial span[style*="color"] {
            color: inherit !important;
        }
        div#serial .serial-blue { 
            color: #5c5cff !important; 
            font-weight: bold !important;
        }
        div#serial .serial-green { 
            color: #00ff00 !important; 
            font-weight: bold !important;
        }
        div#serial .serial-cyan { 
            color: #00ffff !important; 
            font-weight: bold !important;
        }
        #screen_container {
            width: 800px;
            height: 400px;
            border: 1px solid #000;
            background: #000;
            margin: 10px 0;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>V86 Arch Linux Console</h1>
        <div id="status" class="status loading">Loading...</div>
        
        <button onclick="sendCommand('root\n')">Login as root</button>
        <button onclick="sendCommand('ls\n')">List files</button>
        <button onclick="sendCommand('whoami\n')">Who am I</button>
        
        <h3>Serial Console:</h3>
        <div id="serial"></div>
        
        <h3>VGA Screen:</h3>
        <div id="screen_container">
            <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
            <canvas style="display: none"></canvas>
        </div>
        
        <div>
            <input type="text" id="command_input" placeholder="Type command and press Enter" style="width: 70%;">
            <button onclick="sendCommandFromInput()">Send</button>
        </div>
    </div>

    <script src="build/libv86.js"></script>
    <script>
        "use strict";

        let emulator;
        let serialOutput = "";
        let ansiBuffer = "";

        function updateStatus(message, type = 'loading') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            console.log('Status:', message);
        }

        function processAnsiEscape(text) {
            // Debug: log what we're processing
            if (text.includes('[1;34m') || text.includes('[m')) {
                console.log('Processing ANSI text:', text.slice(-100)); // Last 100 chars
            }
            
            // Replace ANSI escape sequences with HTML spans
            let processed = text.replace(/\x1b\[([0-9;]*)m/g, function(match, codes) {
                console.log('ANSI match:', match, 'codes:', codes);
                if (!codes || codes === '0' || codes === '') {
                    return '</span>';
                }
                const codeList = codes.split(';').filter(c => c !== '');
                let classes = [];
                for (let code of codeList) {
                    if (code === '1') classes.push('ansi-1');
                    else if (parseInt(code) >= 30 && parseInt(code) <= 37) classes.push('ansi-' + code);
                }
                const result = classes.length > 0 ? '<span class="' + classes.join(' ') + '">' : '<span>';
                console.log('ANSI result:', result, 'for codes:', codes);
                return result;
            });
            
            return processed;
        }

        function updateSerial(text) {
            ansiBuffer += text;
            
            // First convert spaces, newlines before processing ANSI codes
            let preprocessed = ansiBuffer
                .replace(/\r/g, '')
                .replace(/ /g, '&nbsp;')
                .replace(/\n/g, '<br>');
            
            // Process ANSI codes sequentially to avoid orphaned tags
            let result = '';
            let inSpan = false;
            let i = 0;
            
            while (i < preprocessed.length) {
                // Check for ANSI escape sequence
                if (preprocessed[i] === '\u001b' && preprocessed[i + 1] === '[') {
                    let j = i + 2;
                    let code = '';
                    
                    // Extract the ANSI code
                    while (j < preprocessed.length && preprocessed[j] !== 'm') {
                        code += preprocessed[j];
                        j++;
                    }
                    
                    if (j < preprocessed.length && preprocessed[j] === 'm') {
                        // We found a complete ANSI code
                        if (code === '1;34') {
                            // Blue - close any open span first, then open new one
                            if (inSpan) result += '</span>';
                            result += '<span class="serial-blue">';
                            inSpan = true;
                        } else if (code === '1;32') {
                            // Green
                            if (inSpan) result += '</span>';
                            result += '<span class="serial-green">';
                            inSpan = true;
                        } else if (code === '1;36') {
                            // Cyan
                            if (inSpan) result += '</span>';
                            result += '<span class="serial-cyan">';
                            inSpan = true;
                        } else if (code === '0' || code === '0;0' || code === '') {
                            // Reset - close span if one is open
                            if (inSpan) {
                                result += '</span>';
                                inSpan = false;
                            }
                        }
                        i = j + 1;
                        continue;
                    }
                }
                
                // Regular character
                result += preprocessed[i];
                i++;
            }
            
            const serialDiv = document.getElementById('serial');
            serialDiv.innerHTML = result;
            serialDiv.scrollTop = serialDiv.scrollHeight;
            
            // Debug: Check final DOM
            const spans = serialDiv.querySelectorAll('span');
            if (spans.length > 0) {
                console.log('✓ Colors working! Spans:', spans.length);
            }
        }

        function sendCommand(cmd) {
            if (emulator && emulator.serial0_send) {
                emulator.serial0_send(cmd);
                console.log('Sent command:', cmd);
            }
        }

        function sendCommandFromInput() {
            const input = document.getElementById('command_input');
            if (input.value.trim()) {
                sendCommand(input.value + '\n');
                input.value = '';
            }
        }

        // Handle Enter key in input
        document.getElementById('command_input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendCommandFromInput();
            }
        });

        window.onload = function() {
            updateStatus('Initializing V86...');
            
            try {
                emulator = new V86({
                    wasm_path: "build/v86.wasm",
                    memory_size: 128 * 1024 * 1024,
                    vga_memory_size: 8 * 1024 * 1024,
                    screen_container: document.getElementById("screen_container"),
                    bios: {
                        url: "bios/seabios.bin",
                    },
                    vga_bios: {
                        url: "bios/vgabios.bin",
                    },
                    cdrom: {
                        url: "images/linux4.iso",
                        async: false,
                    },
                    filesystem: {},
                    autostart: true,
                });

                updateStatus('V86 created, waiting for boot...');

                emulator.add_listener("serial0-output-byte", function(byte) {
                    const char = String.fromCharCode(byte);
                    if (char === '\r') return; // Skip carriage returns
                    updateSerial(char);
                });

                emulator.add_listener("emulator-ready", function() {
                    updateStatus('Linux ready! You can interact with the console.', 'success');
                    updateSerial('\n=== Linux Ready ===\n');
                    updateSerial('Use the buttons above or type commands below.\n');
                });

                emulator.add_listener("emulator-started", function() {
                    updateStatus('Linux booting...', 'loading');
                    updateSerial('=== Linux Starting ===\n');
                });

                console.log('V86 emulator initialized');

            } catch (error) {
                console.error('Error initializing V86:', error);
                updateStatus('Failed to initialize: ' + error.message, 'error');
            }
        };
    </script>
</body>
</html>
