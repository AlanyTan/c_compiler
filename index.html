    <style>
      /* Force enable text selection globally - v86 may disable it */
      body,
      body * {
        user-select: text !important;
        -webkit-user-select: text !important;
        -moz-user-select: text !important;
        -ms-user-select: text !important;
      }

      /* Except for buttons and controls */
      button,
      input[type="button"],
      input[type="submit"],
      .btn {
        user-select: none !important;
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
      }

      #editor {
        position: relative;
        height: 400px;
        width: 100%;
        font-size: 14px;
      }

      #terminal {
        background-color: #000;
        height: 600px;
        overflow: hidden;
        border: 1px solid #ccc;
        cursor: text;
        outline: none;
      }

      #terminal:focus-within {
        border: 1px solid #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
      }

      #terminal .xterm {
        height: 100%;
        padding: 10px;
      }

      #terminal .xterm-viewport {
        overflow-y: auto !important;
        scrollbar-color: #3b3b3b #000;
      }

      #terminal.terminal-bell {
        box-shadow: 0 0 0 2px #d4b106 inset, 0 0 12px rgba(212, 177, 6, 0.6);
      }

      .status-panel {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 5px;
        padding: 10px;
        margin: 10px 0;
      }

      .system-info {
        font-family: "Courier New", monospace;
        font-size: 12px;
        color: #555;
      }

      .error-highlight {
        background-color: #ffe6e6;
        border-left: 3px solid #ff0000;
      }

      .success-highlight {
        background-color: #e6ffe6;
        border-left: 3px solid #00aa00;
      }

      #vm-file-modal {
        overflow-y: hidden;
      }

      #vm-file-modal .modal-body {
        max-height: 60vh;
        overflow-y: auto;
      }

      #vm-file-modal .modal-header {
        position: relative;
        padding-right: 42px;
      }

      #vm-file-modal .modal-header .close {
        position: absolute;
        top: 8px;
        right: 12px;
        width: 28px;
        height: 28px;
        line-height: 24px;
        margin: 0;
        z-index: 1;
      }

      .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(0, 0, 0, 0.3);
        border-radius: 50%;
        border-top-color: #000;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

    <!-- V86 Library - Local-only for offline deployment -->
    <script>
      function loadV86() {
        return new Promise((resolve, reject) => {
          if (typeof V86Starter !== "undefined") {
            resolve();
            return;
          }

          const localScript = document.createElement("script");
          localScript.onload = () => {
            setTimeout(() => {
              if (typeof V86Starter !== "undefined") {
                resolve();
              } else if (typeof V86 !== "undefined") {
                window.V86Starter = V86;
                resolve();
              } else {
                reject(
                  new Error(
                    "V86 constructor not available after local loading",
                  ),
                );
              }
            }, 100);
          };
          localScript.onerror = () => {
            reject(new Error("V86 library not found at build/libv86.js"));
          };
          localScript.src = "build/libv86.js";
          document.head.appendChild(localScript);
        });
      }
    </script>

    <script>
      const ARCH_CMDLINE = [
        "console=tty0",
        "console=ttyS0,115200n8",
        "rw",
        "root=host9p rootfstype=9p rootflags=trans=virtio,cache=loose",
        "modules=virtio_pci,virtio_blk,virtio_net,9p,9pnet,9pnet_virtio",
      ].join(" ");

      const VM_STATE_CANDIDATES = [
        "archlinux32/archlinux-v86state.bin",
        "archlinux32/v86state.bin",
      ];

      const VM_ARCH_FILESYSTEM_CANDIDATES = [
        {
          baseurl: "archlinux32/arch/",
          basefs: "archlinux32/fs.json",
          description: "copy.sh-compatible Arch 9p rootfs",
        },
      ];

      const VM_ARCH_KERNEL_CANDIDATES = [
        "archlinux32/boot/vmlinuz-arch",
        "archlinux32/arch/vmlinuz-linux",
      ];

      const VM_ARCH_INITRD_CANDIDATES = [
        "archlinux32/boot/initramfs-arch.img",
        "archlinux32/arch/initramfs-linux.img",
      ];

      const VM_ARCH_DISK_CANDIDATES = ["archlinux32/arch.img"];

      const VM_ARCH_ISO_CANDIDATES = [
        "archlinux32/archlinux32.iso",
        "archlinux32/archlinux-i686.iso",
        "archlinux32/archlinux-x86_64.iso",
      ];

      const ENABLE_VGA_CONSOLE = false;

      const VM_RAM_MB = 256;

      const VM_REQUIRED_FILES = [
        "bios/seabios.bin",
        ...(ENABLE_VGA_CONSOLE ? ["bios/vgabios.bin"] : []),
        "build/libv86.js",
        "build/v86.wasm",
      ];

      async function probeFile(path) {
        try {
          const response = await fetch(path, { method: "HEAD" });
          if (!response.ok) {
            return {
              exists: false,
              status: response.status,
              error: "HTTP " + response.status,
            };
          }

          const size = response.headers.get("content-length");
          return {
            exists: true,
            size: size || "unknown",
          };
        } catch (error) {
          return {
            exists: false,
            error: error.message,
          };
        }
      }

      async function findFirstAvailableFile(paths) {
        for (const path of paths) {
          const details = await probeFile(path);
          if (details.exists) {
            return { path, ...details };
          }
        }
        return null;
      }

      async function findFirstAvailableFilesystem(candidates) {
        for (const candidate of candidates) {
          const basefsDetails = await probeFile(candidate.basefs);
          if (basefsDetails.exists) {
            return {
              ...candidate,
              size: basefsDetails.size,
            };
          }
        }
        return null;
      }

      async function resolveBootAssets(fileDetails) {
        const stateFile = await findFirstAvailableFile(VM_STATE_CANDIDATES);
        if (stateFile) {
          fileDetails[stateFile.path] = {
            exists: true,
            size: stateFile.size,
            note: "selected snapshot candidate",
          };
        }

        const filesystemBundle = await findFirstAvailableFilesystem(
          VM_ARCH_FILESYSTEM_CANDIDATES,
        );
        if (filesystemBundle) {
          fileDetails[filesystemBundle.basefs] = {
            exists: true,
            size: filesystemBundle.size,
            note: filesystemBundle.description,
          };
        }

        if (stateFile && filesystemBundle) {
          return {
            stateFile,
            filesystemBundle,
            kernelFile: null,
            initrdFile: null,
            diskImage: null,
            isoImage: null,
            bootPlan: chooseBootPlan({
              stateFile,
              filesystemBundle,
              kernelFile: null,
              initrdFile: null,
              diskImage: null,
              isoImage: null,
            }),
          };
        }

        if (filesystemBundle) {
          const kernelFile = await findFirstAvailableFile(VM_ARCH_KERNEL_CANDIDATES);
          if (kernelFile) {
            fileDetails[kernelFile.path] = {
              exists: true,
              size: kernelFile.size,
              note: "selected arch kernel candidate",
            };
          }

          const initrdFile = await findFirstAvailableFile(VM_ARCH_INITRD_CANDIDATES);
          if (initrdFile) {
            fileDetails[initrdFile.path] = {
              exists: true,
              size: initrdFile.size,
              note: "selected arch initramfs candidate",
            };
          }

          return {
            stateFile,
            filesystemBundle,
            kernelFile,
            initrdFile,
            diskImage: null,
            isoImage: null,
            bootPlan: chooseBootPlan({
              stateFile,
              filesystemBundle,
              kernelFile,
              initrdFile,
              diskImage: null,
              isoImage: null,
            }),
          };
        }

        const diskImage = await findFirstAvailableFile(VM_ARCH_DISK_CANDIDATES);
        if (diskImage) {
          fileDetails[diskImage.path] = {
            exists: true,
            size: diskImage.size,
            note: "selected raw disk image candidate",
          };
        }

        if (diskImage) {
          return {
            stateFile,
            filesystemBundle: null,
            kernelFile: null,
            initrdFile: null,
            diskImage,
            isoImage: null,
            bootPlan: chooseBootPlan({
              stateFile,
              filesystemBundle: null,
              kernelFile: null,
              initrdFile: null,
              diskImage,
              isoImage: null,
            }),
          };
        }

        const isoImage = await findFirstAvailableFile(VM_ARCH_ISO_CANDIDATES);
        if (isoImage) {
          fileDetails[isoImage.path] = {
            exists: true,
            size: isoImage.size,
            note: "selected iso fallback candidate",
          };
        }

        return {
          stateFile,
          filesystemBundle: null,
          kernelFile: null,
          initrdFile: null,
          diskImage: null,
          isoImage,
          bootPlan: chooseBootPlan({
            stateFile,
            filesystemBundle: null,
            kernelFile: null,
            initrdFile: null,
            diskImage: null,
            isoImage,
          }),
        };
      }

      function chooseBootPlan({
        stateFile,
        filesystemBundle,
        kernelFile,
        initrdFile,
        diskImage,
        isoImage,
      }) {
        if (stateFile && filesystemBundle) {
          return {
            mode: "snapshot-9p",
            summary: `Arch snapshot + 9p rootfs (${stateFile.path})`,
          };
        }

        if (filesystemBundle) {
          return {
            mode: "cold-9p",
            summary: `Arch 9p cold boot (${filesystemBundle.basefs})`,
          };
        }

        if (diskImage) {
          return {
            mode: "disk",
            summary: `Arch raw disk image (${diskImage.path})`,
          };
        }

        if (isoImage) {
          return {
            mode: "iso",
            summary: `Arch ISO cold boot (${isoImage.path})`,
          };
        }

        return null;
      }

      function buildV86BootConfig(plan, assets) {
        const v86Config = {
          wasm_path: "build/v86.wasm",
          memory_size: VM_RAM_MB * 1024 * 1024,
          bios: {
            url: "bios/seabios.bin",
          },
          autostart: true,
          acpi: false,
          fastboot: true,
          // disable_speaker: true,
          // Only serial0 is used4 — disable the other three UARTs
          uart1: false,
          uart2: false,
          uart3: false,
          // No network needed for a local compiler
          net_device: null,
        };

        if (ENABLE_VGA_CONSOLE) {
          v86Config.vga_memory_size = 8 * 1024 * 1024;
          v86Config.vga_bios = {
            url: "bios/vgabios.bin",
          };
        } else {
          // Without VGA, disable v86's mouse adapter — it registers a
          // global window mousedown handler that calls preventDefault()
          // on every click (falling back to document.body when no
          // screen_container is set), which blocks all text selection.
          v86Config.disable_mouse = true;
          v86Config.disable_keyboard = true;
        }

        if (plan.mode === "snapshot-9p" || plan.mode === "cold-9p") {
          v86Config.filesystem = {
            baseurl: assets.filesystemBundle.baseurl,
            basefs: assets.filesystemBundle.basefs,
          };
          v86Config.bzimage_initrd_from_filesystem = true;
          v86Config.cmdline = ARCH_CMDLINE;
        }

        if (plan.mode === "disk") {
          v86Config.hda = {
            url: assets.diskImage.path,
            async: false,
            size: Number(assets.diskImage.size),
          };
        }

        if (plan.mode === "iso") {
          v86Config.boot_order = 0x132;
          v86Config.cdrom = { url: assets.isoImage.path };
        }

        if (assets.stateFile) {
          v86Config.initial_state = { url: assets.stateFile.path };
        }

        return v86Config;
      }

      function describeBootPlan(plan, assets) {
        const lines = [];

        if (!plan) {
          return lines;
        }

        lines.push(`启动模式: ${plan.summary}`);

        if (assets.stateFile) {
          lines.push(`状态快照: ${assets.stateFile.path}`);
        }

        if (assets.filesystemBundle) {
          lines.push(`9p rootfs: ${assets.filesystemBundle.basefs}`);
          lines.push(`9p 文件目录: ${assets.filesystemBundle.baseurl}`);
        }

        if (plan.mode === "disk" && assets.diskImage) {
          lines.push(`磁盘镜像: ${assets.diskImage.path}`);
        }

        if (plan.mode === "iso" && assets.isoImage) {
          lines.push(`ISO: ${assets.isoImage.path}`);
        }

        return lines;
      }

      function showDownloadInstructions() {
        appendToTerminal("📋 Arch 启动资源准备说明:\n");
        appendToTerminal("1. 准备 Arch Linux 32 ISO；copy.sh 的 archlinux 配置是 32-bit，不是 x86_64。\n");
        appendToTerminal("2. 在 QEMU/virt-manager 中安装 Arch32 到 raw 磁盘镜像 archlinux32/arch.img\n");
        appendToTerminal("3. 运行 ./scripts/v86/prepare-arch-image-for-v86.sh ./archlinux32/arch.img\n");
        appendToTerminal("4. 运行 ./scripts/v86/export-arch-image-to-9p.sh ./archlinux32/arch.img\n");
        appendToTerminal("5. 准备 9p rootfs 资源: archlinux32/fs.json 和 archlinux32/arch/\n");
        appendToTerminal("6. 首次 9p 冷启动完成后，点击“保存状态”\n");
        appendToTerminal("7. 将状态文件放到 archlinux32/archlinux-v86state.bin；之后刷新页面会优先使用快照秒开。\n");
      }

      // Check for required files
      async function checkRequiredFiles() {
        const missingFiles = [];
        const fileDetails = {};

        for (const file of VM_REQUIRED_FILES) {
          const details = await probeFile(file);
          fileDetails[file] = details;

          if (!details.exists) {
            missingFiles.push(file);
          }
        }

        const {
          stateFile,
          filesystemBundle,
          kernelFile,
          initrdFile,
          diskImage,
          isoImage,
          bootPlan,
        } = await resolveBootAssets(fileDetails);

        return {
          missingFiles,
          fileDetails,
          stateFile,
          filesystemBundle,
          kernelFile,
          initrdFile,
          diskImage,
          isoImage,
          bootPlan,
        };
      }
      // Global variables
      let editor;
      let v86Interface;
      let isSystemReady = false;
      let missingFiles = [];
      let terminal;
      let terminalFitAddon;
      let terminalBellTimer = null;
      let pendingTerminalOutput = [];

      // Default C code
      const DEFAULT_C_CODE = `#include <stdio.h>

int main(void) {
    printf("In-Browser C compiler!\\n");                                                                    // 浏览器内 C 编译器！
    printf("Use the editor (here) to write your C code and compile it in the browser.\\n");                 // 使用编辑器（此处）编写 C 代码并在浏览器中编译。
    printf("Click 'Compile & Run' to execute your code in the virtual machine.\\n");                        // 点击"编译并运行"在虚拟机中执行你的代码。
    printf("You can also use 'VM File' to load C files from the VM's /home/student/src directory.\\n");    // 你也可以使用"VM 文件"从虚拟机的 /home/student/src 目录加载 C 文件。
    printf("Or use Upload/Download to transfer your code files from/to this browser C development environment.\\n"); // 或使用"上传/下载"在浏览器 C 开发环境之间传输代码文件。
    
    return 0;
}`;

      /**
       * Initialize the application
       */
      async function initializeApp() {
        // Initialize ACE editor first
        initializeEditor();
        initializeTerminal();

        // Restore editor state from IndexedDB (survives page reloads)
        try {
          const savedFile = await idbLoadMeta('activeFile');
          const savedFlags = await idbLoadMeta('compilerFlags');
          if (savedFile) {
            document.getElementById('filename').value = savedFile;
            const savedCode = await idbLoadFile(savedFile);
            if (savedCode !== null) editor.setValue(savedCode, -1);
          }
          if (savedFlags) document.getElementById('compiler-flags').value = savedFlags;
        } catch (e) {
          console.warn('Failed to restore editor state from IndexedDB:', e);
        }

        await ensureVGAConsoleFeature();

        // Set up event handlers
        setupEventHandlers();
        VGAConsole.setup();

        // Update memory info displays from constant
        document.getElementById('memory-info').textContent = '内存:' + VM_RAM_MB + ' MB';
        document.getElementById('ram-info').textContent = VM_RAM_MB + 'MB RAM';

        // Check for required files with detailed logging
        updateSystemStatus("检查系统文件...", "info");
        const {
          missingFiles,
          fileDetails,
          stateFile,
          filesystemBundle,
          kernelFile,
          initrdFile,
          diskImage,
          isoImage,
          bootPlan,
        } = await checkRequiredFiles();

        // Log file check results to console
        console.log("=== 系统文件检查 ===");
        Object.entries(fileDetails).forEach(([file, details]) => {
          if (details.exists) {
            console.log(`✅ ${file} (${details.size} bytes)`);
          } else {
            const marker = details.optional ? "⚠️" : "❌";
            const suffix = details.optional ? " (optional, cold boot fallback)" : "";
            console.log(
              `${marker} ${file} - ${details.note || details.error || "not found"}${suffix}`,
            );
          }
        });

        const bootPlanDetails = describeBootPlan(bootPlan, {
          stateFile,
          filesystemBundle,
          kernelFile,
          initrdFile,
          diskImage,
          isoImage,
        });

        if (bootPlanDetails.length > 0) {
          console.log("=== 启动方案 ===");
          bootPlanDetails.forEach((line) => console.log(line));
        }

        if (!bootPlan) {
          missingFiles.push("vm boot source (arch snapshot, 9p boot assets, disk image, or ISO)");
          fileDetails["vm boot source"] = {
            exists: false,
            error:
              "No compatible Arch boot plan found. Provide an Arch snapshot, a raw disk image, or an Arch ISO.",
          };
        }

        if (missingFiles.length > 0) {
          console.error("Missing required files:", missingFiles);
          handleMissingFiles(missingFiles, fileDetails);
        } else {
          try {
            updateSystemStatus("加载V86库...", "info");
            console.log("正在加载 V86 虚拟机库...");

            await loadV86();

            updateSystemStatus("初始化虚拟机...", "warning");
            console.log("V86 库加载成功，正在初始化虚拟机...");

            await initializeV86({
              stateFile,
              filesystemBundle,
              kernelFile,
              initrdFile,
              diskImage,
              isoImage,
              bootPlan,
            });
          } catch (error) {
            console.error("V86 initialization failed:", error);
            handleV86LoadError(error);
          }
        }
      }

      function initializeTerminal() {

      function fitTerminal() {

          terminalFitAddon.fit();

      }

      function focusTerminal() {
        if (terminal) {
          terminal.focus();
        }
      }

      function flushPendingTerminalOutput() {
        if (!terminal || pendingTerminalOutput.length === 0) {
          return;
        }
        for (const chunk of pendingTerminalOutput) {
          terminal.write(chunk);
        }
        pendingTerminalOutput = [];
        fitTerminal();
      }

      function sendSerialData(data) {
        if (!emulator || !emulator.bus || !emulator.bus.send) {
          return;
        }
        for (let i = 0; i < data.length; i++) {
          emulator.bus.send("serial0-input", data.charCodeAt(i));
        }
      }

          prepareScreenContainer() {
            return null;

              target !== "terminal" &&

      async function ensureVGAConsoleFeature() {

      /**
       * Send command to emulator serial port (raw, no prompt wait).
       */
      function sendRawSerial(text) {
        if (!emulator) return;
        for (let i = 0; i < text.length; i++) {
          emulator.bus.send("serial0-input", text.charCodeAt(i));
        }
      }

      /**
       * Wait for the shell prompt to appear in serialOutput.
       * Resolves once "# " or "$ " is found at the end of the latest output.
       */
      function waitForPrompt(timeoutMs) {
        if (timeoutMs === undefined) timeoutMs = 10000;
        return new Promise(function (resolve, reject) {
          var startTime = Date.now();
          // Check immediately first
          if (/[#$] $/.test(serialOutput)) {
            resolve();
            return;
          }
          var check = setInterval(function () {
            if (/[#$] $/.test(serialOutput)) {
              clearInterval(check);
              resolve();
            } else if (Date.now() - startTime > timeoutMs) {
              clearInterval(check);
              // Resolve anyway — don't block the command entirely
              console.warn('waitForPrompt: timed out, sending command anyway');
              resolve();
            }
          }, 50);
        });
      }

      /**
       * Send command to emulator, waiting for the shell prompt first.
       */
      async function sendCommand(command) {
        if (!emulator) {
          console.error("Emulator not initialized");
          return;
        }
        await waitForPrompt();
        sendRawSerial(command);
      }

      // ===== IndexedDB persistence for /home/student/src files =====
      const IDB_NAME = 'v86-user-files';
      const IDB_STORE = 'files';
      const IDB_META_STORE = 'meta';
      const IDB_VERSION = 1;

      function openIDB() {
        return new Promise(function(resolve, reject) {
          const req = indexedDB.open(IDB_NAME, IDB_VERSION);
          req.onupgradeneeded = function() {
            const db = req.result;
            if (!db.objectStoreNames.contains(IDB_STORE)) {
              db.createObjectStore(IDB_STORE);
            }
            if (!db.objectStoreNames.contains(IDB_META_STORE)) {
              db.createObjectStore(IDB_META_STORE);
            }
          };
          req.onsuccess = function() { resolve(req.result); };
          req.onerror = function() { reject(req.error); };
        });
      }

      /** Save a file's content to IndexedDB (key = filename, value = string) */
      async function idbSaveFile(filename, content) {
        const db = await openIDB();
        return new Promise(function(resolve, reject) {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(content, filename);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { reject(tx.error); };
        });
      }

      /** Load a file's content from IndexedDB. Returns string or null. */
      async function idbLoadFile(filename) {
        const db = await openIDB();
        return new Promise(function(resolve, reject) {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(filename);
          req.onsuccess = function() { resolve(req.result !== undefined ? req.result : null); };
          req.onerror = function() { reject(req.error); };
        });
      }

      /** List all filenames stored in IndexedDB. */
      async function idbListFiles() {
        const db = await openIDB();
        return new Promise(function(resolve, reject) {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).getAllKeys();
          req.onsuccess = function() { resolve(req.result || []); };
          req.onerror = function() { reject(req.error); };
        });
      }

      /** Delete a file from IndexedDB. */
      async function idbDeleteFile(filename) {
        const db = await openIDB();
        return new Promise(function(resolve, reject) {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).delete(filename);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { reject(tx.error); };
        });
      }

      /** Save a metadata value (e.g. active filename, compiler flags). */
      async function idbSaveMeta(key, value) {
        const db = await openIDB();
        return new Promise(function(resolve, reject) {
          const tx = db.transaction(IDB_META_STORE, 'readwrite');
          tx.objectStore(IDB_META_STORE).put(value, key);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { reject(tx.error); };
        });
      }

      /** Load a metadata value. Returns null if not found. */
      async function idbLoadMeta(key) {
        const db = await openIDB();
        return new Promise(function(resolve, reject) {
          const tx = db.transaction(IDB_META_STORE, 'readonly');
          const req = tx.objectStore(IDB_META_STORE).get(key);
          req.onsuccess = function() { resolve(req.result !== undefined ? req.result : null); };
          req.onerror = function() { reject(req.error); };
        });
      }

      /**
       * Restore all persisted files from IndexedDB into the VM's /home/student/src.
       * Called once when the VM becomes ready.
       */
      async function restoreFilesFromIDB() {
        try {
          const filenames = await idbListFiles();
          if (filenames.length === 0) return 0;
          let count = 0;
          for (const name of filenames) {
            const content = await idbLoadFile(name);
            if (content !== null) {
              await writeFileToVM('/home/student/src/' + name, content);
              count++;
            }
          }
          console.log('从浏览器存储恢复了 ' + count + ' 个文件到 VM');
          return count;
        } catch (e) {
          console.warn('Failed to restore files from IndexedDB:', e);
          return 0;
        }
      }

      /**
       * Write a file into the VM's 9p filesystem via the emulator API.
       * Much more reliable than echo-based file creation through serial.
       */
      async function writeFileToVM(filepath, content) {
        if (!emulator || !emulator.create_file || !emulator.fs9p) {
          throw new Error("VM filesystem not available (requires 9p boot mode)");
        }
        const data = new TextEncoder().encode(content);
        await emulator.create_file(filepath, data);
      }

      /**
       * Read a file from the VM's 9p filesystem.
       * Returns the file content as a string, or null if not found.
       */
      async function readFileFromVM(filepath) {
        if (!emulator || !emulator.read_file || !emulator.fs9p) {
          return null;
        }
        try {
          const data = await emulator.read_file(filepath);
          return new TextDecoder().decode(data);
        } catch (e) {
          return null;
        }
      }

      /**
       * List source files in a VM directory.
       * Returns an array of filenames (not full paths).
       */
      function listVMFiles(dirpath) {
        if (!emulator || !emulator.fs9p) {
          return [];
        }
        const entries = emulator.fs9p.read_dir(dirpath);
        if (!entries) return [];
        // Filter to source-code-like files
        return entries.filter(name => /\.(c|cpp|cc|cxx|h|hpp|hxx|txt|py|sh|lua)$/i.test(name)).sort();
      }

      /**
       * Save the current editor content to the VM filesystem.

        // Always persist to IndexedDB (works even before VM is ready)
        try {

          await idbSaveMeta('compilerFlags',
            document.getElementById('compiler-flags').value);
        } catch (e) {
          console.warn('Failed to persist to IndexedDB:', e);
        }

        // Also write to VM if available
        if (!emulator || !isSystemReady) return;
        const vmPath = '/home/student/src/' + filename;
        try {
          await writeFileToVM(vmPath, content);
        } catch (e) {
          console.warn('Failed to save to VM:', e.message);
        }
      }

      /** Debounced auto-save: writes editor content to VM after user stops typing */
      let _autoSaveTimer = null;

      /**
       * Sanitize a filename for safe use in shell commands and paths.
       */
      function sanitizeFilename(name) {
        return name.replace(/[^a-zA-Z0-9._-]/g, "_");
      }

      /**
       * Wait for a compile-completion marker in serial output.
       * Returns the shell exit code (0 = success).
       */
      function waitForCompileMarker(markerId, startPos, timeoutMs) {
        if (timeoutMs === undefined) timeoutMs = 60000;
        return new Promise(function (resolve, reject) {
          var startTime = Date.now();
          var spinnerFrames = [' -', ' \\', ' |', ' /'];
          var spinnerIndex = 0;

          var check = setInterval(function () {
            var recent = serialOutput.substring(startPos);
            // Match marker followed by a digit — distinguishes the real
            // output from the echoed command (which shows literal $?)
            var re = new RegExp("##Compile_" + markerId + " DONE## (\\d+)");
            var match = recent.match(re);
            if (match) {
              clearInterval(check);
              resolve(parseInt(match[1]));
            } else if (Date.now() - startTime > timeoutMs) {
              clearInterval(check);
              reject(new Error("编译超时 (" + (timeoutMs / 1000) + "s)"));
            } else {
              updateSystemStatus('正在编译 ' + spinnerFrames[spinnerIndex], 'info');
              spinnerIndex = (spinnerIndex + 1) % spinnerFrames.length;
            }
          }, 200);
        });
      }

      function setVmInputTarget(target) {
        activeVmInputTarget = VGAConsole.applyInputTarget(target);
      }

      /**
       * Setup terminal keyboard input
       */
      function setupTerminalInput() {
        const terminal = document.getElementById("terminal");
        if (terminal.dataset.vmInputBound === "true") {
          return;
        }
        terminal.dataset.vmInputBound = "true";
        terminal.addEventListener("mousedown", function () {
          setVmInputTarget("terminal");
        });
      }

      async function initializeV86(assets) {
        lastBootAssets = assets;
        try {
          updateSystemStatus("正在启动虚拟机...", "warning");
          appendToTerminal("=== 正在初始化 V86 虚拟机 ===\n");

          // Create canvas element for VGA display
          const screenContainer = VGAConsole.prepareScreenContainer();
          if (!screenContainer) {
            if (VGAConsole.enabled) {
              console.error("screen_container element not found!");
              console.warn("VGA 容器未找到，将以无头模式运行");
            } else {
              console.log("VGA 控制台已禁用，使用无头模式运行");
            }
          } else {
            console.log("Screen container found:", screenContainer);
            console.log("Initialized screen_container structure for V86");
          }

          // Use the correct V86 constructor (V86Starter or V86)
          const V86Constructor =
            typeof V86Starter !== "undefined" ? V86Starter : V86;

          const { bootPlan } = assets;
          const v86Config = buildV86BootConfig(bootPlan, assets);

          if (assets.stateFile) {
            console.log(`检测到快照，使用恢复模式启动: ${assets.stateFile.path}`);
          } else {
            console.log("未检测到快照，使用常规冷启动模式");
          }

          if (assets.filesystemBundle) {
            console.log(`挂载 Arch 9p 文件系统: ${assets.filesystemBundle.basefs}`);
          }

          if (assets.kernelFile) {
            console.log(`Arch 内核: ${assets.kernelFile.path}`);
          }

          if (assets.initrdFile) {
            console.log(`Arch initramfs: ${assets.initrdFile.path}`);
          }

          if (bootPlan.mode === "disk" && assets.diskImage) {
            console.log(`Arch 磁盘镜像: ${assets.diskImage.path}`);
          }

          if (bootPlan.mode === "iso" && assets.isoImage) {
            console.log(`ISO 回退介质: ${assets.isoImage.path}`);
          }

          // Add screen container so V86 can manage its own canvas/text layers
          if (screenContainer) {
            v86Config.screen_container = screenContainer;
          }

          emulator = new V86Constructor(v86Config);
          setVmInputTarget(activeVmInputTarget);
          fitTerminal();

          console.log("V86 已创建，等待系统启动...");

          emulator.add_listener("serial0-output-byte", function (byte) {
            const char = String.fromCharCode(byte);
            appendToTerminal(char);

            serialOutput += char;

            // Login detection (no auto-login - manual only)
            if (!isLoggedIn) {
              loginBuffer += char;

              // Keep buffer manageable (last 100 chars)
              if (loginBuffer.length > 100) {
                loginBuffer = loginBuffer.slice(-100);
              }
            }
          });

          emulator.add_listener("emulator-ready", function () {
            isSystemReady = true;
            updateSystemStatus("Linux 系统就绪", "success");

            // Send Enter to show command prompt, then render after VM responds
            setTimeout(() => {
              emulator.bus.send("serial0-input", 13);
            }, 100);

            // Restore persisted files from IndexedDB into the VM,
            // then sync the active file into the editor.
            (async function() {
              // 1. Restore all saved files into the VM
              await restoreFilesFromIDB();

              // 2. Determine which file to open in the editor
              const filename = sanitizeFilename(
                document.getElementById('filename').value || 'ex_1.1.c'
              );
              const vmPath = '/home/student/src/' + filename;
              const existing = await readFileFromVM(vmPath);
              if (existing !== null && existing.length > 0) {
                editor.setValue(existing, -1);
                console.log('已从 VM 加载文件: ' + vmPath);
              } else {
                // No persisted copy — write the current editor content to VM
                await saveEditorToVM();
                console.log('已将编辑器内容写入 VM: ' + vmPath);
              }

              // 3. Start auto-saving on edits
              editor.session.on('change', scheduleAutoSave);
            })();

            // Force re-enable text selection after V86 loads
            setTimeout(() => {
              document.body.style.userSelect = "text";
              document.body.style.webkitUserSelect = "text";
            }, 100);
          });

          emulator.add_listener("emulator-started", function () {
            // Don't downgrade status if emulator-ready already fired
            // (happens during snapshot restore where ready fires before started)
            if (!isSystemReady) {
              updateSystemStatus("Linux 正在启动...", "warning");
            }
          });

          emulator.add_listener("download-progress", function (e) {
            // Silently track download progress
          });

          emulator.add_listener("download-error", function (e) {
            console.error("Download error:", e);
            // Only show critical errors in terminal
          });

          // Enable keyboard input immediately after emulator is created
          setupTerminalInput();
        } catch (error) {
          console.error("Failed to initialize V86:", error);
          updateSystemStatus("虚拟机启动失败", "danger");
          appendToTerminal("错误: 无法启动虚拟机系统\n" + error.message + "\n");
        }
      }

      /**
       * Set up event handlers
       */
      function setupEventHandlers() {
        // Compile and run button
        document
          .getElementById("compile-run-btn")
          .addEventListener("click", compileAndRun);

        // Compile only button
        document
          .getElementById("compile-only-btn")
          .addEventListener("click", compileOnly);

        // File operations
        document
          .getElementById("new-file-btn")
          .addEventListener("click", newFile);
        document
          .getElementById("vm-open-btn")
          .addEventListener("click", showVMFilePicker);
        document
          .getElementById("save-btn")
          .addEventListener("click", saveFile);
        document
          .getElementById("upload-btn")
          .addEventListener("click", uploadFile);
        document
          .getElementById("download-btn")
          .addEventListener("click", downloadFile);
        document
          .getElementById("file-input")
          .addEventListener("change", handleFileUpload);

        // Terminal operations
        document
          .getElementById("clear-terminal-btn")
          .addEventListener("click", clearTerminal);
        document
          .getElementById("restart-vm-btn")
          .addEventListener("click", restartVM);
        document
          .getElementById("save-state-btn")
          .addEventListener("click", saveVMState);

        // Format code
        document
          .getElementById("format-btn")
          .addEventListener("click", formatCode);

        // C standard selection
        document
          .getElementById("c-standard")
          .addEventListener("change", updateCompilerFlags);

        // When the filename field changes, try to load that file from the VM
        document
          .getElementById("filename")
          .addEventListener("change", function () {
            if (!emulator || !isSystemReady) return;
            const name = sanitizeFilename(this.value);
            if (!name) return;
            openFileFromVM(name);
          });
      }

      /**
       * Compile the current editor content on the VM.
       * Returns the exit code (0 = success).
       */
      async function compile(filename, outputFile) {
        if (!emulator || !isSystemReady) {
          alert("系统尚未就绪，请等待虚拟机启动完成");
          return -1;
        }

        const code = editor.getValue();
        const flags = document.getElementById("compiler-flags").value;
        const vmPath = "/home/student/src/" + filename;

        updateSystemStatus("正在保存文件...", "info");

        // Write source file directly to VM filesystem via 9p API
        await writeFileToVM(vmPath, code);

        // Compile with marker-based completion detection
        const markerId = Date.now();
        const compileCmd = [
        // "echo 3 > /proc/sys/vm/drop_caches 2>/dev/null",
          "cd /home/student/src",
          "gcc " + flags + " " + filename + " -o " + outputFile + " 2>&1 && echo '##Compile_" + markerId + " DONE##' $?",
        ].join("\n ");

        const startPos = serialOutput.length;
        updateSystemStatus("正在编译...", "info");
        await sendCommand(compileCmd + "\n");

        const exitCode = await waitForCompileMarker(markerId, startPos, 120000);

        if (exitCode !== 0) {
          updateSystemStatus("编译失败", "danger");
        } else {
          updateSystemStatus("编译完成", "success");
        }
        return exitCode;
      }

      /**
       * Compile and run code
       */
      async function compileAndRun() {
        try {
          const filename = sanitizeFilename(
            document.getElementById("filename").value || "main.c",
          );
          const outputFile = "/tmp/" + filename + ".out";
          const exitCode = await compile(filename, outputFile);
          if (exitCode !== 0) return;

          appendToTerminal("\n=== 运行程序 ===\n\r");

          updateSystemStatus("正在运行...", "info");
          await sendCommand(outputFile + "\n");
          updateSystemStatus("编译运行完成", "success");
        } catch (error) {
          console.error("Compilation failed:", error);
          updateSystemStatus(error.message || "编译失败", "danger");
        }
      }

      /**
       * Compile only (no execution)
       */
      async function compileOnly() {
        try {
          const filename = sanitizeFilename(
            document.getElementById("filename").value || "main.c",
          );
          const outputFile = "/tmp/" + filename + ".out";
          updateSystemStatus("正在编译...", "info");
          const exitCode = await compile(filename, outputFile);
          if (exitCode !== 0) return;
          updateSystemStatus("编译完成", "success");
        } catch (error) {
          console.error("Compilation failed:", error);
          updateSystemStatus(error.message || "编译失败", "danger");
        }
      }

      /**
       * Create new file (writes default code to VM)
       */
      function newFile() {
        editor.setValue("", -1);
        document.getElementById("filename").value = "untitled.c";
        clearErrorAnnotations();
        hideErrorPanel();
        saveEditorToVM();
      }

      /**
       * Save current editor content to VM filesystem
       */
      async function saveFile() {
        if (!emulator || !isSystemReady) {
          alert("系统尚未就绪，请等待虚拟机启动完成");
          return;
        }
        try {
          await saveEditorToVM();
          updateSystemStatus("已保存", "success");
        } catch (e) {
          alert("保存失败: " + e.message);
        }
      }

      /**
       * Upload file
       */
      function uploadFile() {
        document.getElementById("file-input").click();
      }

      /**
       * Handle file upload (browser file → editor + VM)
       */
      function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          editor.setValue(e.target.result, -1);
          document.getElementById("filename").value = file.name;
          // Also write to VM so it's the source of truth
          saveEditorToVM();
        };
        reader.readAsText(file);
      }

      /**
       * Download current file
       */
      function downloadFile() {
        const filename =
          document.getElementById("filename").value || "main.c";
        const content = editor.getValue();

        const blob = new Blob([content], { type: "text/plain" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      /**
       * Restart VM
       */
      async function restartVM() {
        if (!emulator) {
          appendToTerminal("虚拟机未初始化\n");
          return;
        }

        // Persist current editor state to IndexedDB before reload
        await saveEditorToVM();

        // A page reload is the only reliable way to restart with 9p boot.
        // emulator.restart() only resets the CPU — it cannot re-load the
        // kernel/initramfs that bzimage_initrd_from_filesystem injected at
        // construction time.  Destroying and re-creating the V86 instance
        // in-page causes "BUG: bad page state" because v86's WASM memory
        // is not fully released between instances.
        location.reload();
      }

      /**
       * Save VM state for instant boot
       */
      async function saveVMState() {
        if (!emulator) {
          alert("虚拟机未初始化");
          return;
        }

        updateSystemStatus("正在保存系统状态...", "info");
        appendToTerminal("\n=== 保存虚拟机状态 ===\n");
        appendToTerminal("请稍候，正在创建快照...\n");

        try {
          const state = await emulator.save_state();

          // Download the state file
          const blob = new Blob([state], { type: "application/octet-stream" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "archlinux-v86state.bin";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          updateSystemStatus("状态已保存！", "success");
          appendToTerminal("✓ 状态已保存为 archlinux-v86state.bin\n");
          appendToTerminal(
            "文件大小: " +
              (state.byteLength / 1024 / 1024).toFixed(2) +
              " MB\n",
          );
          appendToTerminal("\n下一步:\n");
          appendToTerminal("1. 将文件移动到 archlinux32/archlinux-v86state.bin\n");
          appendToTerminal("2. 刷新页面即可享受秒速启动！\n");
        } catch (error) {
          console.error("Save state exception:", error);
          alert("保存失败: " + error.message);
          appendToTerminal("错误: " + error.message + "\n");
        }
      }

      /**
       * Format code
       */
      function formatCode() {
        // Use ACE's beautify extension
        ace.require("ace/ext/beautify").beautify(editor.session);
      }

      /**
       * Update compiler flags based on C standard
       */
      function updateCompilerFlags() {
        const standard = document.getElementById("c-standard").value;
        const currentFlags = document.getElementById("compiler-flags").value;

        // Replace existing standard flag or add new one
        const newFlags =
          currentFlags.replace(/-std=c\d+/, "") + " -std=" + standard;
        document.getElementById("compiler-flags").value = newFlags.trim();
      }

      /**
       * Append text to terminal
       */
      function appendToTerminal(text) {
        const normalizedText = text.replace(/\u00FF/g, "");
        if (!terminal) {
          pendingTerminalOutput.push(normalizedText);
          return;
        }
        terminal.write(normalizedText);
      }

      /**
       * Clear terminal
       */
      function clearTerminal() {
        if (terminal) {
          terminal.clear();
        } else {
          pendingTerminalOutput = [];
        }
      }

      /**
       * Update system status
       */
      function updateSystemStatus(message, type) {
        const statusElement = document.getElementById("system-status");
        statusElement.textContent = message;
        statusElement.className = "label label-" + type;

        const vmStatus = document.getElementById("vm-status");
        if (vmStatus) {
          vmStatus.textContent = message;
        }
      }

      /**
       * Parse GCC output for errors
       */
      function parseGccOutput(output) {
        const errors = [];
        const lines = output.split("\\n");

        for (const line of lines) {
          // Parse GCC error format: filename:line:column: type: message
          const match = line.match(/([^:]+):(\\d+):(\\d+):\\s*(\\w+):\\s*(.+)/);
          if (match) {
            errors.push({
              file: match[1],
              line: parseInt(match[2]),
              column: parseInt(match[3]),
              type: match[4],
              message: match[5],
            });
          }
        }

        return errors;
      }

      /**
       * Show error panel
       */
      function showErrorPanel(errors) {
        const panel = document.getElementById("error-panel");
        const output = document.getElementById("error-output");

        let errorText = "";
        for (const error of errors) {
          errorText += `${error.file}:${error.line}:${error.column}: ${error.type}: ${error.message}\\n`;
        }

        output.textContent = errorText;
        panel.style.display = "block";
      }

      /**
       * Hide error panel
       */
      function hideErrorPanel() {
        document.getElementById("error-panel").style.display = "none";
      }

      /**
       * Update error annotations in editor
       */
      function updateErrorAnnotations(errors) {
        const annotations = errors.map((error) => ({
          row: error.line - 1,
          column: error.column,
          text: error.message,
          type: error.type === "error" ? "error" : "warning",
        }));

        editor.session.setAnnotations(annotations);
      }

      /**
       * Clear error annotations
       */
      function clearErrorAnnotations() {
        editor.session.setAnnotations([]);
      }

      /**
       * Handle missing files
       */
      function handleMissingFiles(missingFiles, fileDetails) {
        updateSystemStatus("缺少系统文件", "danger");

        let message = "以下文件缺失:\n\n";
        missingFiles.forEach((file) => {
          message += "❌ " + file + "\n";
        });

        appendToTerminal(message);

        // Show download instructions
        showDownloadInstructions();
      }

      /**
       * Handle V86 load error
       */
      function handleV86LoadError(error) {
        updateSystemStatus("V86 库加载失败", "danger");
        appendToTerminal("❌ V86 emulator library failed to load\n");
        appendToTerminal("Error: " + error.message + "\n\n");
        appendToTerminal("📋 解决方案:\n");
        appendToTerminal("1. 确认 build/libv86.js 与 build/v86.wasm 已随离线包一同分发\n");
        appendToTerminal("2. 在本地 Web 服务器根目录中保留 build/ 路径结构\n");
        appendToTerminal("3. 如需更新依赖，请同步刷新离线包中的本地库文件\n");
      }

      // Initialize the application when page loads
      window.addEventListener("load", initializeApp);
    </script>
  </body>
</html>
