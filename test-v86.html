    <!-- V86 Library - Load from multiple sources -->
    <script>
        // Try to load v86 from multiple sources
        function loadV86() {
            return new Promise((resolve, reject) => {
                // Check if already loaded
                if (typeof V86Starter !== 'undefined') {
                    resolve();
                    return;
                }
                
                // Try local first since we have it downloaded
                const localScript = document.createElement('script');
                localScript.onload = () => {
                    // Wait a bit for V86 constructor to be available
                    setTimeout(() => {
                        if (typeof V86Starter !== 'undefined') {
                            resolve();
                        } else if (typeof V86 !== 'undefined') {
                            // Make V86 available as V86Starter for compatibility
                            window.V86Starter = V86;
                            resolve();
                        } else {
                            reject(new Error('V86 constructor not available after local loading'));
                        }
                    }, 100);
                };
                localScript.onerror = () => {
                    console.warn('Local v86 failed, trying CDN...');
                    // Try CDN as fallback
                    const cdnScript = document.createElement('script');
                    cdnScript.src = 'https://unpkg.com/v86@latest/build/libv86.js';
                    cdnScript.onload = () => {
                        setTimeout(() => {
                            if (typeof V86Starter !== 'undefined') {
                                resolve();
                            } else if (typeof V86 !== 'undefined') {
                                // Make V86 available as V86Starter for compatibility
                                window.V86Starter = V86;
                                resolve();
                            } else {
                                reject(new Error('V86 constructor not available after CDN loading'));
                            }
                        }, 100);
                    };
                    cdnScript.onerror = () => {
                        reject(new Error('V86 library not found in local or CDN'));
                    };
                    document.head.appendChild(cdnScript);
                };
                localScript.src = 'build/libv86.js';
                document.head.appendChild(localScript);
            });
        }
    </script>

    <script>
        // Simplified V86 Configuration  
        const V86_SIMPLE_CONFIG = {
            wasm_path: "build/v86.wasm", // Local wasm file matching CDN version
            memory_size: 512 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            // screen_container will be set during initialization
            autostart: true,
            disable_jit: false,
            log_level: 1
        };
        
        // Check for required files
        async function checkRequiredFiles() {
            const requiredFiles = [
                'bios/seabios.bin',
                'bios/vgabios.bin', 
                'images/alpine-v86state.bin',
                'build/libv86.js',
                'build/v86.wasm'
            ];
            
            const missingFiles = [];
            const fileDetails = {};
            
            for (const file of requiredFiles) {
                try {
                    const response = await fetch(file, { method: 'HEAD' });
                    if (response.ok) {
                        const size = response.headers.get('content-length');
                        fileDetails[file] = { exists: true, size: size || 'unknown' };
                    } else {
                        missingFiles.push(file);
                        fileDetails[file] = { exists: false, status: response.status };
                    }
                } catch (error) {
                    missingFiles.push(file);
                    fileDetails[file] = { exists: false, error: error.message };
                }
            }
            
            return { missingFiles, fileDetails };
        }
        // Global variables
        let editor;
        let v86Interface;
        let isSystemReady = false;
        let missingFiles = [];

        // Default C++ code
        const DEFAULT_CPP_CODE = `#include <iostream>
#include <string>
#include <vector>

int main() {
    std::cout << "欢迎使用现代 C++ 编译器!" << std::endl;
    std::cout << "支持 C++17/20 标准特性" << std::endl;
    
    // 演示现代 C++ 特性
    std::vector<std::string> features = {
        "自动类型推导",
        "范围 for 循环", 
        "Lambda 表达式",
        "智能指针",
        "并发编程支持"
    };
    
    std::cout << "\\n现代 C++ 特性:" << std::endl;
    for (const auto& feature : features) {
        std::cout << "- " << feature << std::endl;
    }
    
    return 0;
}`;

        /**
         * Initialize the application
         */
        async function initializeApp() {
            // Initialize ACE editor first
            initializeEditor();
            
            // Set up event handlers
            setupEventHandlers();
            
            // Check for required files with detailed logging
            updateSystemStatus('检查系统文件...', 'info');
            const { missingFiles, fileDetails } = await checkRequiredFiles();
            
            // Show file check results in terminal
            appendToTerminal('=== 系统文件检查 ===\n');
            Object.entries(fileDetails).forEach(([file, details]) => {
                if (details.exists) {
                    appendToTerminal(`✅ ${file} (${details.size} bytes)\n`);
                } else {
                    appendToTerminal(`❌ ${file} - ${details.error || 'HTTP ' + details.status}\n`);
                }
            });
            appendToTerminal('\n');
            
            if (missingFiles.length > 0) {
                console.error('Missing required files:', missingFiles);
                handleMissingFiles(missingFiles, fileDetails);
            } else {
                // Try to load V86 library - local first, then CDN fallback
                try {
                    updateSystemStatus('加载V86库...', 'info');
                    appendToTerminal('正在加载 V86 虚拟机库...\n');
                    
                    await loadV86();
                    
                    updateSystemStatus('初始化虚拟机...', 'warning');
                    appendToTerminal('V86 库加载成功，正在初始化虚拟机...\n');
                    
                    await initializeV86();
                } catch (error) {
                    console.error('V86 initialization failed:', error);
                    handleV86LoadError(error);
                }
            }
        }

        /**
         * Initialize ACE editor
         */
        function initializeEditor() {
            editor = ace.edit("editor");
            editor.setTheme("ace/theme/monokai");
            editor.session.setMode("ace/mode/c_cpp");
            editor.setValue(DEFAULT_CPP_CODE, -1);
            
            // Enable language tools
            ace.require("ace/ext/language_tools");
            editor.setOptions({
                enableBasicAutocompletion: true,
                enableSnippets: true,
                enableLiveAutocompletion: true,
                fontSize: 14,
                showPrintMargin: false,
                wrap: true
            });
        }

        /**
         * Initialize V86 emulator
         */
        // Global emulator variable
        let emulator;
        let serialOutput = "";
        let isLoggedIn = false;
        let loginBuffer = "";
        
        /**
         * Send command to emulator
         */
        function sendCommand(command) {
            if (!emulator) {
                console.error('Emulator not initialized');
                return;
            }
            for (let i = 0; i < command.length; i++) {
                // Use bus.send for serial input instead of serial0_send
                emulator.bus.send("serial0-input", command.charCodeAt(i));
            }
        }
        
        /**
         * Setup terminal keyboard input
         */
        function setupTerminalInput() {
            const terminal = document.getElementById('terminal');
            
            terminal.addEventListener('keydown', function(e) {
                if (!emulator) return;
                
                // Prevent default for most keys to avoid browser shortcuts
                if (!e.ctrlKey || e.key === 'c' || e.key === 'd' || e.key === 'z') {
                    e.preventDefault();
                }
                
                let charCode;
                
                // Handle special keys
                if (e.key === 'Enter') {
                    charCode = 13;
                } else if (e.key === 'Backspace') {
                    charCode = 8;
                } else if (e.key === 'Tab') {
                    charCode = 9;
                } else if (e.key === 'Escape') {
                    charCode = 27;
                } else if (e.key === 'ArrowUp') {
                    charCode = 27; // ESC
                    emulator.serial0_send(charCode);
                    emulator.serial0_send(91); // [
                    charCode = 65; // A
                } else if (e.key === 'ArrowDown') {
                    charCode = 27;
                    emulator.serial0_send(charCode);
                    emulator.serial0_send(91);
                    charCode = 66; // B
                } else if (e.key === 'ArrowRight') {
                    charCode = 27;
                    emulator.serial0_send(charCode);
                    emulator.serial0_send(91);
                    charCode = 67; // C
                } else if (e.key === 'ArrowLeft') {
                    charCode = 27;
                    emulator.serial0_send(charCode);
                    emulator.serial0_send(91);
                    charCode = 68; // D
                } else if (e.ctrlKey) {
                    // Handle Ctrl+C, Ctrl+D, etc.
                    if (e.key === 'c' || e.key === 'C') {
                        charCode = 3; // Ctrl+C
                    } else if (e.key === 'd' || e.key === 'D') {
                        charCode = 4; // Ctrl+D
                    } else if (e.key === 'z' || e.key === 'Z') {
                        charCode = 26; // Ctrl+Z
                    } else {
                        return; // Ignore other Ctrl combinations
                    }
                } else if (e.key.length === 1) {
                    // Regular character
                    charCode = e.key.charCodeAt(0);
                } else {
                    return; // Ignore other special keys
                }
                
                if (charCode !== undefined) {
                    if (emulator && emulator.bus && emulator.bus.send) {
                        emulator.bus.send("serial0-input", charCode);
                    } else {
                        console.error('bus.send not available! emulator:', emulator);
                    }
                }
            });
            
            // Auto-focus terminal on click
            terminal.addEventListener('click', function() {
                terminal.focus();
            });
            
            // Auto-focus terminal when page loads
            setTimeout(() => {
                terminal.focus();
            }, 2000);
        }

        async function initializeV86() {
            try {
                updateSystemStatus('正在启动虚拟机...', 'warning');
                appendToTerminal('=== 正在初始化 V86 虚拟机 ===\n');
                
                // Use the correct V86 constructor (V86Starter or V86)
                const V86Constructor = typeof V86Starter !== 'undefined' ? V86Starter : V86;
                
                emulator = new V86Constructor({
                    wasm_path: "build/v86.wasm",
                    memory_size: 512 * 1024 * 1024,
                    vga_memory_size: 8 * 1024 * 1024,
                    // Don't set screen_container - use headless mode, VGA can be enabled later
                    bios: {
                        url: "bios/seabios.bin",
                    },
                    vga_bios: {
                        url: "bios/vgabios.bin",
                    },
                    initial_state: {
                        url: "images/alpine-v86state.bin",
                    },
                    network_relay_url: "wss://relay.widgetry.org/",
                    filesystem: {},
                    autostart: true,
                });

                appendToTerminal('V86 已创建，等待系统启动...\n');

                let escapeBuffer = '';
                let inEscapeSequence = false;

                emulator.add_listener("serial0-output-byte", function(byte) {
                    const char = String.fromCharCode(byte);
                    
                    // Handle ANSI escape sequences
                    if (char === '\x1b') { // ESC character
                        inEscapeSequence = true;
                        escapeBuffer = '\x1b';
                        return;
                    }
                    
                    if (inEscapeSequence) {
                        escapeBuffer += char;
                        
                        // Check if escape sequence is complete
                        // Most sequences end with a letter (A-Z, a-z)
                        if (/[A-Za-z]/.test(char)) {
                            // Process the escape sequence
                            processEscapeSequence(escapeBuffer);
                            escapeBuffer = '';
                            inEscapeSequence = false;
                        }
                        return;
                    }
                    
                    if (char === '\r') return; // Skip carriage returns
                    
                    serialOutput += char;
                    appendToTerminal(char);
                    
                    // Login detection (no auto-login - manual only)
                    if (!isLoggedIn) {
                        loginBuffer += char;
                        
                        // Keep buffer manageable (last 100 chars)
                        if (loginBuffer.length > 100) {
                            loginBuffer = loginBuffer.slice(-100);
                        }
                        
                    }
                });
                
                // Process ANSI escape sequences
                function processEscapeSequence(seq) {
                    // Log escape sequences for debugging (optional)
                    // console.log('Escape sequence:', seq.split('').map(c => c.charCodeAt(0).toString(16)).join(' '));
                    
                    // Most common sequences:
                    // ESC[H - cursor home
                    // ESC[J - clear screen
                    // ESC[K - clear line
                    // ESC[nA - cursor up n lines
                    // ESC[nB - cursor down n lines
                    // ESC[nC - cursor forward n chars
                    // ESC[nD - cursor back n chars
                    // ESC[n;mH - cursor position
                    // ESC[nm - graphics mode
                    
                    // For now, we'll silently consume these sequences
                    // A full terminal emulator would implement cursor positioning, colors, etc.
                }

                emulator.add_listener("emulator-ready", function() {
                    updateSystemStatus('Linux 系统就绪', 'success');
                    appendToTerminal('\n=== Linux 系统就绪 ===\n');
                    appendToTerminal('您可以使用下面的按钮编译和运行代码\n');
                    appendToTerminal('或直接点击此终端窗口输入命令\n');
                });

                emulator.add_listener("emulator-started", function() {
                    updateSystemStatus('Linux 正在启动...', 'warning');
                });
                
                emulator.add_listener("download-progress", function(e) {
                    // Silently track download progress
                });
                
                emulator.add_listener("download-error", function(e) {
                    console.error('Download error:', e);
                    // Only show critical errors in terminal
                });

                // Enable keyboard input immediately after emulator is created
                setupTerminalInput();
                
            } catch (error) {
                console.error('Failed to initialize V86:', error);
                updateSystemStatus('虚拟机启动失败', 'danger');
                appendToTerminal('错误: 无法启动虚拟机系统\n' + error.message + '\n');
            }
        }

        /**
         * Compile and run code
         */
        async function compileAndRun() {
            if (!emulator) {
                alert('系统尚未就绪，请等待虚拟机启动完成');
                return;
            }

            const filename = document.getElementById('filename').value || 'main.cpp';
            const code = editor.getValue();
            const flags = document.getElementById('compiler-flags').value;

            try {
                updateSystemStatus('准备编译...', 'info');
                clearTerminal();
                appendToTerminal('=== 开始编译 ===\n');
                appendToTerminal(`文件: ${filename}\n`);
                appendToTerminal(`编译选项: ${flags}\n\n`);
                
                // Create the file content on VM
                const escapedCode = code.replace(/'/g, "'\\''").replace(/\n/g, '\\n');
                sendCommand(`echo '${escapedCode}' > /tmp/${filename}\n`);
                
                // Wait a bit for file creation
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Compile
                appendToTerminal(`正在编译...\n`);
                sendCommand(`cd /tmp && g++ ${flags} ${filename} -o program 2>&1\n`);
                
                // Wait for compilation
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Run if compilation succeeded
                appendToTerminal(`\n正在运行程序...\n`);
                sendCommand(`cd /tmp && ./program 2>&1\n`);
                
                updateSystemStatus('编译运行完成', 'success');
                
            } catch (error) {
                console.error('Compilation failed:', error);
                appendToTerminal('编译错误: ' + error.message + '\n');
                updateSystemStatus('编译失败', 'danger');
            }
        }

        /**
         * Compile only (no execution)
         */
        async function compileOnly() {
            if (!emulator) {
                alert('系统尚未就绪，请等待虚拟机启动完成');
                return;
            }

            const filename = document.getElementById('filename').value || 'main.cpp';
            const code = editor.getValue();
            const flags = document.getElementById('compiler-flags').value;

            try {
                updateSystemStatus('编译中...', 'info');
                clearTerminal();
                appendToTerminal('=== 仅编译 ===\n');
                
                // Create the file content on VM
                const escapedCode = code.replace(/'/g, "'\\''").replace(/\n/g, '\\n');
                sendCommand(`echo '${escapedCode}' > /tmp/${filename}\n`);
                
                await new Promise(resolve => setTimeout(resolve, 500));
                
                sendCommand(`cd /tmp && g++ ${flags} ${filename} -o program 2>&1\n`);
                
                updateSystemStatus('编译完成', 'success');
                
            } catch (error) {
                console.error('Compilation failed:', error);
                updateSystemStatus('编译失败', 'danger');
            }
        }

        /**
         * Create new file
         */
        function newFile() {
            editor.setValue(DEFAULT_CPP_CODE, -1);
            document.getElementById('filename').value = 'main.cpp';
            clearErrorAnnotations();
            hideErrorPanel();
        }

        /**
         * Upload file
         */
        function uploadFile() {
            document.getElementById('file-input').click();
        }

        /**
         * Handle file upload
         */
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                editor.setValue(e.target.result, -1);
                document.getElementById('filename').value = file.name;
            };
            reader.readAsText(file);
        }

        /**
         * Download current file
         */
        function downloadFile() {
            const filename = document.getElementById('filename').value || 'main.cpp';
            const content = editor.getValue();
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        /**
         * Clear terminal
         */
        function clearTerminal() {
            document.getElementById('terminal').textContent = '';
        }

        /**
         * Restart VM
         */
        function restartVM() {
            updateSystemStatus('重启虚拟机中...', 'warning');
            
            if (emulator) {
                emulator.restart();
                clearTerminal();
                appendToTerminal('正在重启虚拟机系统...\n');
            } else {
                appendToTerminal('虚拟机未初始化\n');
            }
        }

        /**
         * Save VM state for instant boot
         */
        async function saveVMState() {
            if (!emulator) {
                alert('虚拟机未初始化');
                return;
            }
            
            updateSystemStatus('正在保存系统状态...', 'info');
            appendToTerminal('\n=== 保存虚拟机状态 ===\n');
            appendToTerminal('请稍候，正在创建快照...\n');
            
            try {
                const state = await emulator.save_state();
                
                // Download the state file
                const blob = new Blob([state], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'alpine-v86state.bin';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                updateSystemStatus('状态已保存！', 'success');
                appendToTerminal('✓ 状态已保存为 alpine-v86state.bin\n');
                appendToTerminal('文件大小: ' + (state.byteLength / 1024 / 1024).toFixed(2) + ' MB\n');
                appendToTerminal('\n下一步:\n');
                appendToTerminal('1. 将文件复制到 images/ 目录\n');
                appendToTerminal('2. 刷新页面即可享受秒速启动！\n');
            } catch (error) {
                console.error('Save state exception:', error);
                alert('保存失败: ' + error.message);
                appendToTerminal('错误: ' + error.message + '\n');
            }
        }

        /**
         * Enable network in Alpine Linux
         */
        function enableNetwork() {
            if (!emulator) {
                alert('虚拟机未初始化');
                return;
            }
            
            if (!isLoggedIn) {
                alert('请等待系统完全启动后再启用网络');
                appendToTerminal('\n提示: 等待自动登录完成...\n');
                return;
            }
            
            appendToTerminal('\n=== 启用网络 ===\n');
            appendToTerminal('正在配置网络接口...\n\n');
            
            // Step 1: Load network driver
            appendToTerminal('步骤 1/4: 加载网络驱动\n');
            sendCommand('modprobe ne2k-pci 2>&1\n');
            
            // Step 2: Bring up interface
            setTimeout(() => {
                appendToTerminal('步骤 2/4: 启动网络接口\n');
                sendCommand('ip link set eth0 up 2>&1\n');
            }, 1500);
            
            // Step 3: Get IP via DHCP
            setTimeout(() => {
                appendToTerminal('步骤 3/4: 获取 IP 地址 (DHCP)\n');
                sendCommand('udhcpc -i eth0 2>&1\n');
            }, 3000);
            
            // Step 4: Show status and test
            setTimeout(() => {
                appendToTerminal('步骤 4/4: 检查网络状态\n');
                sendCommand('ip addr show eth0\n');
            }, 5000);
            
            setTimeout(() => {
                appendToTerminal('\n测试网络连接:\n');
                sendCommand('ping -c 3 1.1.1.1 || echo "网络连接失败"\n');
            }, 6500);
            
            appendToTerminal('\n等待配置完成...\n');
        }

        /**
         * Debug VM status and force tests
         */
        function debugVM() {
            appendToTerminal('\n=== 调试模式激活 ===\n');
            
            if (!emulator) {
                appendToTerminal('错误: 虚拟机未初始化\n');
                return;
            }
            
            appendToTerminal('发送测试命令...\n');
            sendCommand('echo "Debug test"\n');
            sendCommand('ls --color /\n');
            
            appendToTerminal('调试命令已发送，请等待响应...\n');
        }

        /**
         * Show system information
         */
        function showSystemInfo() {
            if (emulator) {
                appendToTerminal('\n=== 系统信息 ===\n');
                appendToTerminal('虚拟机: V86 x86 模拟器\n');
                appendToTerminal('内存: 512MB RAM\n');
                appendToTerminal('系统: Linux (32-bit)\n');
                sendCommand('uname -a\n');
                sendCommand('gcc --version | head -1\n');
            } else {
                appendToTerminal('系统信息: V86 x86 512 RAM\n');
            }
        }

        /**
         * Format code
         */
        function formatCode() {
            // Use ACE's beautify extension
            ace.require("ace/ext/beautify").beautify(editor.session);
        }

        /**
         * Update compiler flags based on C++ standard
         */
        function updateCompilerFlags() {
            const standard = document.getElementById('cpp-standard').value;
            const currentFlags = document.getElementById('compiler-flags').value;
            
            // Replace existing standard flag or add new one
            const newFlags = currentFlags.replace(/-std=c\+\+\d+/, '') + ' -std=' + standard;
            document.getElementById('compiler-flags').value = newFlags.trim();
        }

        // ANSI buffer for terminal output
        let terminalAnsiBuffer = '';
        
        /**
         * Append text to terminal with ANSI color processing
         */
        function appendToTerminal(text) {
            terminalAnsiBuffer += text;
            
            // First convert spaces, newlines before processing ANSI codes
            // Also filter out unicode 255 (0xFF) character
            let preprocessed = terminalAnsiBuffer
                .replace(/\r/g, '')
                .replace(/\u00FF/g, '')  // Remove unicode 255 character
                .replace(/ /g, '&nbsp;')
                .replace(/\n/g, '<br>');
            
            // Process ANSI codes sequentially to avoid orphaned tags
            let result = '';
            let inSpan = false;
            let i = 0;
            
            while (i < preprocessed.length) {
                // Check for ANSI escape sequence
                if (preprocessed[i] === '\u001b' && preprocessed[i + 1] === '[') {
                    let j = i + 2;
                    let code = '';
                    
                    // Extract the ANSI code
                    while (j < preprocessed.length && preprocessed[j] !== 'm') {
                        code += preprocessed[j];
                        j++;
                    }
                    
                    if (j < preprocessed.length && preprocessed[j] === 'm') {
                        // We found a complete ANSI code
                        if (code === '1;34') {
                            // Blue - close any open span first, then open new one
                            if (inSpan) result += '</span>';
                            result += '<span class="serial-blue">';
                            inSpan = true;
                        } else if (code === '1;32') {
                            // Green
                            if (inSpan) result += '</span>';
                            result += '<span class="serial-green">';
                            inSpan = true;
                        } else if (code === '1;36') {
                            // Cyan
                            if (inSpan) result += '</span>';
                            result += '<span class="serial-cyan">';
                            inSpan = true;
                        } else if (code === '0' || code === '0;0' || code === '') {
                            // Reset - close span if one is open
                            if (inSpan) {
                                result += '</span>';
                                inSpan = false;
                            }
                        }
                        i = j + 1;
                        continue;
                    }
                }
                
                // Regular character
                result += preprocessed[i];
                i++;
            }
            
            const terminal = document.getElementById('terminal');
            terminal.innerHTML = result;
            terminal.scrollTop = terminal.scrollHeight;
        }

        /**
         * Clear terminal
         */
        function clearTerminal() {
            terminalAnsiBuffer = '';
            const terminal = document.getElementById('terminal');
            terminal.innerHTML = '';
        }
        
        /**
         * Update system status
         */
        function updateSystemStatus(message, type) {
            const statusElement = document.getElementById('system-status');
            statusElement.textContent = message;
            statusElement.className = 'label label-' + type;
        }

        /**
         * Parse GCC output for errors
         */
        function parseGccOutput(output) {
            const errors = [];
            const lines = output.split('\\n');
            
            for (const line of lines) {
                // Parse GCC error format: filename:line:column: type: message
                const match = line.match(/([^:]+):(\\d+):(\\d+):\\s*(\\w+):\\s*(.+)/);
                if (match) {
                    errors.push({
                        file: match[1],
                        line: parseInt(match[2]),
                        column: parseInt(match[3]),
                        type: match[4],
                        message: match[5]
                    });
                }
            }
            
            return errors;
        }

        /**
         * Show error panel
         */
        function showErrorPanel(errors) {
            const panel = document.getElementById('error-panel');
            const output = document.getElementById('error-output');
            
            let errorText = '';
            for (const error of errors) {
                errorText += `${error.file}:${error.line}:${error.column}: ${error.type}: ${error.message}\\n`;
            }
            
            output.textContent = errorText;
            panel.style.display = 'block';
        }

        /**
         * Hide error panel
         */
        function hideErrorPanel() {
            document.getElementById('error-panel').style.display = 'none';
        }

        /**
         * Update error annotations in editor
         */
        function updateErrorAnnotations(errors) {
            const annotations = errors.map(error => ({
                row: error.line - 1,
                column: error.column,
                text: error.message,
                type: error.type === 'error' ? 'error' : 'warning'
            }));
            
            editor.session.setAnnotations(annotations);
        }

        /**
         * Clear error annotations
         */
        function clearErrorAnnotations() {
            editor.session.setAnnotations([]);
        }

        /**
         * Handle missing files
         */
        function handleMissingFiles(missingFiles, fileDetails) {
            updateSystemStatus('缺少系统文件', 'danger');
            
            let message = '以下文件缺失:\n\n';
            missingFiles.forEach(file => {
                message += '❌ ' + file + '\n';
            });
            
            appendToTerminal(message);
            
            // Show download instructions
            showDownloadInstructions();
        }
        
        /**
         * Handle V86 load error
         */
        function handleV86LoadError(error) {
            updateSystemStatus('V86 库加载失败', 'danger');
            appendToTerminal('❌ V86 emulator library failed to load\n');
            appendToTerminal('Error: ' + error.message + '\n\n');
            appendToTerminal('📋 解决方案:\n');
            appendToTerminal('1. 检查网络连接\n');
            appendToTerminal('2. 下载本地 v86 库到 v86-lib/ 目录\n');
            appendToTerminal('3. 参考 V86_MIGRATION_COMPLETE.md 设置说明\n');
        }
        
        // Initialize the application when page loads
        window.addEventListener('load', initializeApp);
    </script>
