    <style>
      /* Force enable text selection globally - v86 may disable it */
      body,
      body * {
        user-select: text !important;
        -webkit-user-select: text !important;
        -moz-user-select: text !important;
        -ms-user-select: text !important;
      }

      /* Except for buttons and controls */
      button,
      input[type="button"],
      input[type="submit"],
      .btn {
        user-select: none !important;
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
      }

      #editor {
        position: relative;
        height: 400px;
        width: 100%;
        font-size: 14px;
      }

      #terminal {
        background-color: #000;
        color: #fff;
        font-family: "Courier New", monospace;
        font-size: 12px;
        height: 300px;
        overflow-y: scroll;
        padding: 10px;
        white-space: pre-wrap;
        border: 1px solid #ccc;
        cursor: text;
        outline: none;
        caret-color: transparent; /* Hide contenteditable cursor */
      }

      #terminal:focus {
        border: 1px solid #4caf50;
        box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
      }

      /* ANSI Terminal Colors */
      #terminal .serial-blue {
        color: #5c5cff !important;
        font-weight: bold !important;
      }
      #terminal .serial-green {
        color: #00ff00 !important;
        font-weight: bold !important;
      }
      #terminal .serial-cyan {
        color: #00ffff !important;
        font-weight: bold !important;
      }

      /* Terminal cursor */
      #terminal .cursor {
        background-color: #00ff00 !important;
        color: #000 !important;
        animation: blink 1s step-end infinite;
        display: inline-block;
      }

      @keyframes blink {
        50% {
          background-color: transparent !important;
          color: #fff !important;
        }
      }

      .status-panel {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 5px;
        padding: 10px;
        margin: 10px 0;
      }

      .system-info {
        font-family: "Courier New", monospace;

      .error-highlight {
        background-color: #ffe6e6;
        border-left: 3px solid #ff0000;

      .success-highlight {
        background-color: #e6ffe6;
        border-left: 3px solid #00aa00;

      .loading {

        height: 20px;
        border: 3px solid rgba(0, 0, 0, 0.3);
        border-radius: 50%;
        border-top-color: #000;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

    <script>
      // Try to load v86 from multiple sources
      function loadV86() {
        return new Promise((resolve, reject) => {
          // Check if already loaded
          if (typeof V86Starter !== "undefined") {
            resolve();
            return;
          }

          // Try local first since we have it downloaded
          const localScript = document.createElement("script");
          localScript.onload = () => {
            // Wait a bit for V86 constructor to be available
            setTimeout(() => {
              if (typeof V86Starter !== "undefined") {
                resolve();
              } else if (typeof V86 !== "undefined") {
                // Make V86 available as V86Starter for compatibility
                window.V86Starter = V86;
                resolve();
              } else {
                reject(
                  new Error(
                    "V86 constructor not available after local loading",
                  ),
                );
              }
            }, 100);
          };
          localScript.onerror = () => {
            console.warn("Local v86 failed, trying CDN...");
            // Try CDN as fallback
            const cdnScript = document.createElement("script");
            cdnScript.src = "https://unpkg.com/v86@latest/build/libv86.js";
            cdnScript.onload = () => {
              setTimeout(() => {
                if (typeof V86Starter !== "undefined") {
                  resolve();
                } else if (typeof V86 !== "undefined") {
                  // Make V86 available as V86Starter for compatibility
                  window.V86Starter = V86;
                  resolve();
                } else {
                  reject(
                    new Error(
                      "V86 constructor not available after CDN loading",
                    ),
                  );
                }
              }, 100);
            };
            cdnScript.onerror = () => {
              reject(new Error("V86 library not found in local or CDN"));
            };
            document.head.appendChild(cdnScript);
          };
          localScript.src = "build/libv86.js";
          document.head.appendChild(localScript);
        });
      }
    </script>

      const V86_SIMPLE_CONFIG = {

      // Check for required files
      async function checkRequiredFiles() {
        const requiredFiles = [
          "bios/seabios.bin",
          "bios/vgabios.bin",
          "images/alpine-v86state.bin",
          "build/libv86.js",
          "build/v86.wasm",
        ];

        const missingFiles = [];
        const fileDetails = {};

        for (const file of requiredFiles) {
          try {
            const response = await fetch(file, { method: "HEAD" });
            if (response.ok) {
              const size = response.headers.get("content-length");
              fileDetails[file] = { exists: true, size: size || "unknown" };
            } else {
              missingFiles.push(file);
              fileDetails[file] = { exists: false, status: response.status };
            }
          } catch (error) {
            missingFiles.push(file);
            fileDetails[file] = { exists: false, error: error.message };
          }
        }

        return { missingFiles, fileDetails };
      }
      // Global variables
      let editor;
      let v86Interface;
      let isSystemReady = false;
      let missingFiles = [];

      // Default C++ code
      const DEFAULT_CPP_CODE = `#include <iostream>

    std::vector<std::string> features = {

        "范围 for 循环",

      /**
       * Initialize the application
       */
      async function initializeApp() {
        // Initialize ACE editor first
        initializeEditor();

        // Set up event handlers
        setupEventHandlers();

        // Check for required files with detailed logging
        updateSystemStatus("检查系统文件...", "info");
        const { missingFiles, fileDetails } = await checkRequiredFiles();

        // Show file check results in terminal
        appendToTerminal("=== 系统文件检查 ===\n");
        Object.entries(fileDetails).forEach(([file, details]) => {
          if (details.exists) {
            appendToTerminal(`✅ ${file} (${details.size} bytes)\n`);
          } else {
            appendToTerminal(
              `❌ ${file} - ${details.error || "HTTP " + details.status}\n`,
            );
          }
        });
        appendToTerminal("\n");

        if (missingFiles.length > 0) {
          console.error("Missing required files:", missingFiles);
          handleMissingFiles(missingFiles, fileDetails);
        } else {
          // Try to load V86 library - local first, then CDN fallback
          try {
            updateSystemStatus("加载V86库...", "info");
            appendToTerminal("正在加载 V86 虚拟机库...\n");

            await loadV86();

            updateSystemStatus("初始化虚拟机...", "warning");
            appendToTerminal("V86 库加载成功，正在初始化虚拟机...\n");

            await initializeV86();
          } catch (error) {
            console.error("V86 initialization failed:", error);
            handleV86LoadError(error);
          }
        }
      }

      function initializeEditor() {
        editor = ace.edit("editor");

        editor.setValue(DEFAULT_CPP_CODE, -1);

        // Enable language tools

      /**
       * Initialize V86 emulator
       */
      // Global emulator variable
      let emulator;
      let serialOutput = "";
      let isLoggedIn = false;
      let loginBuffer = "";
      let isUserSelecting = false; // Track if user is actively selecting text with mouse

      /**
       * Send command to emulator
       */
      function sendCommand(command) {
        if (!emulator) {
          console.error("Emulator not initialized");
          return;
        }
        for (let i = 0; i < command.length; i++) {
          // Use bus.send for serial input instead of serial0_send
          emulator.bus.send("serial0-input", command.charCodeAt(i));
        }
      }

      /**
       * Setup terminal keyboard input
       */
      function setupTerminalInput() {
        const terminal = document.getElementById("terminal");

        // Track text selection state - DON'T interfere with browser's selection
        terminal.addEventListener("mousedown", function (e) {
          isUserSelecting = true;
          // DON'T clear selection here - let browser handle it naturally
        });

        terminal.addEventListener("mouseup", function (e) {
          isUserSelecting = false;
        });

        // Also track when mouse leaves terminal
        terminal.addEventListener("mouseleave", function (e) {
          if (isUserSelecting) {
            isUserSelecting = false;
          }
        });

        terminal.addEventListener("keydown", function (e) {
          if (!emulator) return;

          // Clear any selection when user starts typing (except Ctrl+C to copy)
          const hasSelection = window.getSelection().toString().length > 0;

          // If user has selected text and presses Ctrl+C, allow copy operation
          if (hasSelection && e.ctrlKey && (e.key === "c" || e.key === "C")) {
            // Don't prevent default - allow browser's copy
            return;
          }

          // Don't intercept other Ctrl keys when text is selected (allow copy operations)
          if (hasSelection && (e.ctrlKey || e.metaKey)) {
            return;
          }

          // For any other key press, clear selection to allow terminal updates
          if (hasSelection) {
            window.getSelection().removeAllRanges();
          }

          // Prevent default for most keys to avoid browser shortcuts
          if (!e.ctrlKey || e.key === "c" || e.key === "d" || e.key === "z") {
            e.preventDefault();
          }

          let charCode;

          // Handle special keys
          if (e.key === "Enter") {
            charCode = 13;
          } else if (e.key === "Backspace") {
            charCode = 8;
          } else if (e.key === "Tab") {
            charCode = 9;
          } else if (e.key === "Escape") {
            charCode = 27;
          } else if (e.key === "ArrowUp") {
            // Send ESC[A
            emulator.bus.send("serial0-input", 27); // ESC
            emulator.bus.send("serial0-input", 91); // [
            emulator.bus.send("serial0-input", 65); // A
            return;
          } else if (e.key === "ArrowDown") {
            // Send ESC[B
            emulator.bus.send("serial0-input", 27);
            emulator.bus.send("serial0-input", 91);
            emulator.bus.send("serial0-input", 66); // B
            return;
          } else if (e.key === "ArrowRight") {
            // Send ESC[C
            emulator.bus.send("serial0-input", 27);
            emulator.bus.send("serial0-input", 91);
            emulator.bus.send("serial0-input", 67); // C
            return;
          } else if (e.key === "ArrowLeft") {
            // Send ESC[D
            emulator.bus.send("serial0-input", 27);
            emulator.bus.send("serial0-input", 91);
            emulator.bus.send("serial0-input", 68); // D
            return;
          } else if (e.ctrlKey) {
            // Handle Ctrl+C, Ctrl+D, etc.
            if (e.key === "c" || e.key === "C") {
              charCode = 3; // Ctrl+C
            } else if (e.key === "d" || e.key === "D") {
              charCode = 4; // Ctrl+D
            } else if (e.key === "z" || e.key === "Z") {
              charCode = 26; // Ctrl+Z
            } else {
              return; // Ignore other Ctrl combinations
            }
          } else if (e.key.length === 1) {
            // Regular character
            charCode = e.key.charCodeAt(0);
          } else {
            return; // Ignore other special keys
          }

          if (charCode !== undefined) {
            if (emulator && emulator.bus && emulator.bus.send) {
              emulator.bus.send("serial0-input", charCode);
            } else {
              console.error("bus.send not available! emulator:", emulator);
            }
          }
        });

        // Handle paste events
        terminal.addEventListener("paste", function (e) {
          if (!emulator) return;

          e.preventDefault(); // Prevent default paste behavior

          // Get pasted text from clipboard
          const pastedText = e.clipboardData.getData("text");

          // Send each character to the emulator
          for (let i = 0; i < pastedText.length; i++) {
            const charCode = pastedText.charCodeAt(i);
            if (emulator && emulator.bus && emulator.bus.send) {
              emulator.bus.send("serial0-input", charCode);
            }
          }

          console.log("Pasted text to terminal:", pastedText);
        });

        // Prevent manual editing of terminal content
        // contenteditable is only for enabling paste context menu
        terminal.addEventListener("input", function (e) {
          e.preventDefault();
          // Don't allow manual editing - terminal content is controlled by VM output
          return false;
        });

        terminal.addEventListener("beforeinput", function (e) {
          // Block all input except paste (which we handle separately)
          if (e.inputType !== "insertFromPaste") {
            e.preventDefault();
          }
        });

        // Prevent contenteditable cursor from moving on mousedown
        terminal.addEventListener("mousedown", function (e) {
          // Don't let contenteditable move its cursor - we manage our own cursor
          // This prevents the caret from jumping around
          const selection = window.getSelection();
          if (selection.rangeCount > 0) {
            const range = selection.getRangeAt(0);
            // Save current selection/cursor position
            setTimeout(() => {
              // Restore or clear after any contenteditable changes
              if (window.getSelection().toString().length === 0) {
                window.getSelection().removeAllRanges();
              }
            }, 0);
          }
        });

        // Auto-focus terminal on click
        terminal.addEventListener("click", function (e) {
          n;

          // If they're selecting, don't steal focus
          if (window.getSelection().toString().length === 0) {
            terminal.focus();
          }
        });

        // Don't auto-focus - let user click when they want to type
        // This allows text selection to work properly after boot
      }

      async function initializeV86() {
        try {
          updateSystemStatus("正在启动虚拟机...", "warning");
          appendToTerminal("=== 正在初始化 V86 虚拟机 ===\n");

          // Use the correct V86 constructor (V86Starter or V86)
          const V86Constructor =
            typeof V86Starter !== "undefined" ? V86Starter : V86;

          emulator = new V86Constructor({
            wasm_path: "build/v86.wasm",
            memory_size: 512 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            // Don't set screen_container - use headless mode, VGA can be enabled later
            bios: {
              url: "bios/seabios.bin",
            },
            vga_bios: {
              url: "bios/vgabios.bin",
            },
            bzimage: {
              url: "fs/vmlinuz-virt",
            },
            initrd: {
              url: "fs/initramfs-virt",
            },
            //initial_state: {
            //    url: "images/alpine-v86state.bin",
            //},
            // network_relay_url: "wss://relay.widgetry.org/",
            filesystem: {},
            autostart: true,
          });

          appendToTerminal("V86 已创建，等待系统启动...\n");

          let escapeBuffer = "";
          let inEscapeSequence = false;
          let currentLine = ""; // Track the current line being edited
          let cursorPos = 0; // Track cursor position within current line

          emulator.add_listener("serial0-output-byte", function (byte) {
            const char = String.fromCharCode(byte);
            // Handle ANSI escape sequences
            if (char === "\x1b") {
              // ESC character
              inEscapeSequence = true;
              escapeBuffer = "\x1b";
              return;
            }

            if (inEscapeSequence) {
              escapeBuffer += char;

              // Check if escape sequence is complete
              // Most sequences end with a letter (A-Z, a-z)
              if (/[A-Za-z]/.test(char)) {
                // Process the escape sequence
                processEscapeSequence(escapeBuffer);
                escapeBuffer = "";
                inEscapeSequence = false;
              }
              return;
            }

            // Handle carriage return - move cursor to beginning of current line
            if (char === "\r") {
              cursorPos = 0;
              return;
            }

            // Handle newline - finalize current line and start new one
            if (char === "\n") {
              terminalAnsiBuffer += currentLine + "\n";
              currentLine = "";
              cursorPos = 0;
              renderTerminal();
              return;
            }

            // Handle backspace character
            if (char === "\b") {
              // Move cursor back one position
              if (cursorPos > 0) {
                cursorPos--;
              }
              renderTerminal();
              return;
            }

            // Regular character - insert/overwrite at cursor position
            // Handle special control characters
            const charCode = char.charCodeAt(0);

            if (charCode === 7) {
              // Bell character - blink screen
              const terminal = document.getElementById("terminal");
              terminal.style.opacity = "0.3";
              setTimeout(() => {
                terminal.style.opacity = "1";
              }, 100);
              return;
            }

            if (charCode < 32 && charCode !== 9) {
              // Skip other control chars except tab
              return;
            }

            // Always overwrite at cursor position (like a real terminal)
            if (cursorPos >= currentLine.length) {
              // At or beyond end - append
              currentLine += char;
            } else {
              // In middle - overwrite the character at cursor position
              currentLine =
                currentLine.substring(0, cursorPos) +
                char +
                currentLine.substring(cursorPos + 1);
            }
            cursorPos++;
            renderTerminal();

            serialOutput += char;

            // Login detection (no auto-login - manual only)
            if (!isLoggedIn) {
              loginBuffer += char;

              // Keep buffer manageable (last 100 chars)
              if (loginBuffer.length > 100) {
                loginBuffer = loginBuffer.slice(-100);
              }
            }
          });

          // Render terminal with current buffer + current line
          function renderTerminal() {
            const terminal = document.getElementById("terminal");

            // Don't update if:
            // 1. User is actively selecting (mousedown, even before text appears selected)
            // 2. There's any text selection (preserves completed selection)
            const hasSelection = window.getSelection().toString().length > 0;
            if (isUserSelecting || hasSelection) {
              return; // Preserve user's text selection or selection in progress
            }

            // First, clean and format the buffer and current line (without cursor)
            const cleanBuffer = terminalAnsiBuffer
              .replace(/\u00FF/g, "")
              .replace(/ /g, "&nbsp;")
              .replace(/\n/g, "<br>");

            const cleanLine = currentLine
              .replace(/\u00FF/g, "")
              .replace(/ /g, "&nbsp;");

            // Now insert cursor at the correct position in the cleaned line
            let lineWithCursor = cleanLine;
            if (cursorPos >= 0 && cursorPos <= currentLine.length) {
              // Calculate position in the cleaned string (each space became &nbsp; = 6 chars)
              let cleanPos = 0;
              for (let i = 0; i < cursorPos; i++) {
                if (currentLine.charAt(i) === " ") {
                  cleanPos += 6; // &nbsp; is 6 characters
                } else {
                  cleanPos += 1;
                }
              }

              const before = cleanLine.substring(0, cleanPos);
              let cursorContent;
              if (cursorPos < currentLine.length) {
                // Get the character at cursor position
                const char = currentLine.charAt(cursorPos);
                cursorContent = char === " " ? "&nbsp;" : char;
                const afterPos = char === " " ? cleanPos + 6 : cleanPos + 1;
                const after = cleanLine.substring(afterPos);
                lineWithCursor =
                  before +
                  '<span class="cursor">' +
                  cursorContent +
                  "</span>" +
                  after;
              } else {
                // Cursor at end - show space
                lineWithCursor =
                  cleanLine + '<span class="cursor">&nbsp;</span>';
              }
            }

            const fullContent = cleanBuffer + lineWithCursor;
            terminal.innerHTML = fullContent;
            terminal.scrollTop = terminal.scrollHeight;
          }

          // Process ANSI escape sequences
          function processEscapeSequence(seq) {
            // ESC[C or ESC[nC - cursor right
            if (seq.match(/^\x1b\[(\d*)C$/)) {
              const match = seq.match(/^\x1b\[(\d*)C$/);
              const charsToMove = match[1] ? parseInt(match[1]) : 1;
              cursorPos = Math.min(currentLine.length, cursorPos + charsToMove);
              renderTerminal();
            }
            // ESC[D or ESC[nD - cursor left
            else if (seq.match(/^\x1b\[(\d*)D$/)) {
              const match = seq.match(/^\x1b\[(\d*)D$/);
              const charsToMove = match[1] ? parseInt(match[1]) : 1;
              cursorPos = Math.max(0, cursorPos - charsToMove);
              renderTerminal();
            }
            // ESC[A - cursor up (history)
            else if (seq === "\x1b[A") {
              // Shell handles history, just render
              renderTerminal();
            }
            // ESC[B - cursor down (history)
            else if (seq === "\x1b[B") {
              // Shell handles history, just render
              renderTerminal();
            }
            // ESC[J or ESC[0J - clear from cursor to end of screen (treat as end of line)
            else if (seq === "\x1b[J" || seq === "\x1b[0J") {
              // Clear from cursor position to end of current line
              currentLine = currentLine.substring(0, cursorPos);
              renderTerminal();
            }
            // ESC[K - clear from cursor to end of line
            else if (seq === "\x1b[K" || seq === "\x1b[0K") {
              currentLine = currentLine.substring(0, cursorPos);
              renderTerminal();
            }
            // ESC[2K - clear entire line
            else if (seq === "\x1b[2K") {
              currentLine = "";
              cursorPos = 0;
              renderTerminal();
            }
            // ESC[2J - clear entire screen
            else if (seq === "\x1b[2J") {
              terminalAnsiBuffer = "";
              currentLine = "";
              cursorPos = 0;
              renderTerminal();
            }
            // Other sequences: silently consume for now
          }

          emulator.add_listener("emulator-ready", function () {
            updateSystemStatus("Linux 系统就绪", "success");
            appendToTerminal("\n=== Linux 系统就绪 ===\n");
            appendToTerminal("您可以使用下面的按钮编译和运行代码\n");
            appendToTerminal("或直接点击此终端窗口输入命令\n");

            // Send Enter to show command prompt, then render after VM responds
            setTimeout(() => {
              emulator.bus.send("serial0-input", 13);
              // Give VM time to send prompt, then force a render
              setTimeout(() => {
                renderTerminal();
              }, 100);
            }, 100);

            // Force re-enable text selection after V86 loads
            setTimeout(() => {
              document.body.style.userSelect = "text";
              document.body.style.webkitUserSelect = "text";

              // V86 is calling preventDefault() on mouse events which blocks selection
              // Override preventDefault to allow selection everywhere including terminal

              const forceAllowSelection = function (e) {
                // Override preventDefault for all mouse events to allow selection
                const originalPreventDefault = e.preventDefault;
                e.preventDefault = function () {
                  console.log(
                    "Blocked preventDefault on",
                    e.type,
                    "to allow selection",
                  );
                  // Don't actually prevent default - allow selection!
                };
              };

              // Add in capture phase to run BEFORE V86's listeners
              document.addEventListener("mousedown", forceAllowSelection, true);
              document.addEventListener("mousemove", forceAllowSelection, true);

              console.log(
                "Text selection forced enabled everywhere - preventDefault blocked",
              );
            }, 100);
          });

          emulator.add_listener("emulator-started", function () {
            updateSystemStatus("Linux 正在启动...", "warning");
          });

          emulator.add_listener("download-progress", function (e) {
            // Silently track download progress
          });

          emulator.add_listener("download-error", function (e) {
            console.error("Download error:", e);
            // Only show critical errors in terminal
          });

          // Enable keyboard input immediately after emulator is created
          setupTerminalInput();
        } catch (error) {
          console.error("Failed to initialize V86:", error);
          updateSystemStatus("虚拟机启动失败", "danger");
          appendToTerminal("错误: 无法启动虚拟机系统\n" + error.message + "\n");
        }
      }

      /**
       * Set up event handlers
       */
      function setupEventHandlers() {
        // Compile and run button
        document
          .getElementById("compile-run-btn")
          .addEventListener("click", compileAndRun);

        // Compile only button
        document
          .getElementById("compile-only-btn")
          .addEventListener("click", compileOnly);

        // File operations
        document
          .getElementById("new-file-btn")
          .addEventListener("click", newFile);
        document
          .getElementById("upload-btn")
          .addEventListener("click", uploadFile);
        document
          .getElementById("download-btn")
          .addEventListener("click", downloadFile);
        document
          .getElementById("file-input")
          .addEventListener("change", handleFileUpload);

        // Terminal operations
        document
          .getElementById("clear-terminal-btn")
          .addEventListener("click", clearTerminal);
        document
          .getElementById("restart-vm-btn")
          .addEventListener("click", restartVM);
        document
          .getElementById("save-state-btn")
          .addEventListener("click", saveVMState);

        // Format code
        document
          .getElementById("format-btn")
          .addEventListener("click", formatCode);

        // C++ standard selection
        document
          .getElementById("cpp-standard")
          .addEventListener("change", updateCompilerFlags);
      }

      /**
       * Compile and run code
       */
      async function compileAndRun() {
        if (!emulator) {
          alert("系统尚未就绪，请等待虚拟机启动完成");
          return;
        }

        const filename =
          document.getElementById("filename").value || "main.cpp";
        const code = editor.getValue();
        const flags = document.getElementById("compiler-flags").value;

        try {
          updateSystemStatus("准备编译...", "info");
          clearTerminal();
          appendToTerminal("=== 开始编译 ===\n");
          appendToTerminal(`文件: ${filename}\n`);
          appendToTerminal(`编译选项: ${flags}\n\n`);

          // Create the file content on VM
          const escapedCode = code.replace(/'/g, "'\\''").replace(/\n/g, "\\n");
          sendCommand(`echo '${escapedCode}' > /tmp/${filename}\n`);

          // Wait a bit for file creation
          await new Promise((resolve) => setTimeout(resolve, 500));

          // Compile
          appendToTerminal(`正在编译...\n`);
          sendCommand(`cd /tmp && g++ ${flags} ${filename} -o program 2>&1\n`);

          // Wait for compilation
          await new Promise((resolve) => setTimeout(resolve, 2000));

          // Run if compilation succeeded
          appendToTerminal(`\n正在运行程序...\n`);
          sendCommand(`cd /tmp && ./program 2>&1\n`);

          updateSystemStatus("编译运行完成", "success");
        } catch (error) {
          console.error("Compilation failed:", error);
          appendToTerminal("编译错误: " + error.message + "\n");
          updateSystemStatus("编译失败", "danger");
        }
      }

      /**
       * Compile only (no execution)
       */
      async function compileOnly() {
        if (!emulator) {
          alert("系统尚未就绪，请等待虚拟机启动完成");
          return;
        }

        const filename =
          document.getElementById("filename").value || "main.cpp";
        const code = editor.getValue();
        const flags = document.getElementById("compiler-flags").value;

        try {
          updateSystemStatus("编译中...", "info");
          clearTerminal();
          appendToTerminal("=== 仅编译 ===\n");

          // Create the file content on VM
          const escapedCode = code.replace(/'/g, "'\\''").replace(/\n/g, "\\n");
          sendCommand(`echo '${escapedCode}' > /tmp/${filename}\n`);

          await new Promise((resolve) => setTimeout(resolve, 500));

          sendCommand(`cd /tmp && g++ ${flags} ${filename} -o program 2>&1\n`);

          updateSystemStatus("编译完成", "success");
        } catch (error) {
          console.error("Compilation failed:", error);
          updateSystemStatus("编译失败", "danger");
        }
      }

      /**
       * Create new file
       */
      function newFile() {
        editor.setValue(DEFAULT_CPP_CODE, -1);
        document.getElementById("filename").value = "main.cpp";
        clearErrorAnnotations();
        hideErrorPanel();
      }

      /**
       * Upload file
       */
      function uploadFile() {
        document.getElementById("file-input").click();
      }

      /**
       * Handle file upload
       */
      function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          editor.setValue(e.target.result, -1);
          document.getElementById("filename").value = file.name;
        };
        reader.readAsText(file);
      }

      /**
       * Download current file
       */
      function downloadFile() {
        const filename =
          document.getElementById("filename").value || "main.cpp";
        const content = editor.getValue();

        const blob = new Blob([content], { type: "text/plain" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      /**
       * Clear terminal
       */
      function clearTerminal() {
        document.getElementById("terminal").textContent = "";
      }

      /**
       * Restart VM
       */
      function restartVM() {
        updateSystemStatus("重启虚拟机中...", "warning");

        if (emulator) {
          emulator.restart();
          clearTerminal();
          appendToTerminal("正在重启虚拟机系统...\n");
        } else {
          appendToTerminal("虚拟机未初始化\n");
        }
      }

      /**
       * Save VM state for instant boot
       */
      async function saveVMState() {
        if (!emulator) {
          alert("虚拟机未初始化");
          return;
        }

        updateSystemStatus("正在保存系统状态...", "info");
        appendToTerminal("\n=== 保存虚拟机状态 ===\n");
        appendToTerminal("请稍候，正在创建快照...\n");

        try {
          const state = await emulator.save_state();

          // Download the state file
          const blob = new Blob([state], { type: "application/octet-stream" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "alpine-v86state.bin";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          updateSystemStatus("状态已保存！", "success");
          appendToTerminal("✓ 状态已保存为 alpine-v86state.bin\n");
          appendToTerminal(
            "文件大小: " +
              (state.byteLength / 1024 / 1024).toFixed(2) +
              " MB\n",
          );
          appendToTerminal("\n下一步:\n");
          appendToTerminal("1. 将文件复制到 images/ 目录\n");
          appendToTerminal("2. 刷新页面即可享受秒速启动！\n");
        } catch (error) {
          console.error("Save state exception:", error);
          alert("保存失败: " + error.message);
          appendToTerminal("错误: " + error.message + "\n");
        }
      }

      /**
       * Format code
       */
      function formatCode() {
        // Use ACE's beautify extension
        ace.require("ace/ext/beautify").beautify(editor.session);
      }

      /**
       * Update compiler flags based on C++ standard
       */
      function updateCompilerFlags() {
        const standard = document.getElementById("cpp-standard").value;
        const currentFlags = document.getElementById("compiler-flags").value;

        // Replace existing standard flag or add new one
        const newFlags =
          currentFlags.replace(/-std=c\+\+\d+/, "") + " -std=" + standard;
        document.getElementById("compiler-flags").value = newFlags.trim();
      }

      // ANSI buffer for terminal output
      let terminalAnsiBuffer = "";

      /**
       * Append text to terminal with ANSI color processing
       */
      function appendToTerminal(text) {
        terminalAnsiBuffer += text;

        // First convert spaces, newlines before processing ANSI codes
        // Also filter out unicode 255 (0xFF) character
        let preprocessed = terminalAnsiBuffer
          .replace(/\r/g, "")
          .replace(/\u00FF/g, "") // Remove unicode 255 character
          .replace(/ /g, "&nbsp;")
          .replace(/\n/g, "<br>");

        // Process ANSI codes sequentially to avoid orphaned tags
        let result = "";
        let inSpan = false;
        let i = 0;

        while (i < preprocessed.length) {
          // Check for ANSI escape sequence
          if (preprocessed[i] === "\u001b" && preprocessed[i + 1] === "[") {
            let j = i + 2;
            let code = "";

            // Extract the ANSI code
            while (j < preprocessed.length && preprocessed[j] !== "m") {
              code += preprocessed[j];
              j++;
            }

            if (j < preprocessed.length && preprocessed[j] === "m") {
              // We found a complete ANSI code
              if (code === "1;34") {
                // Blue - close any open span first, then open new one
                if (inSpan) result += "</span>";
                result += '<span class="serial-blue">';
                inSpan = true;
              } else if (code === "1;32") {
                // Green
                if (inSpan) result += "</span>";
                result += '<span class="serial-green">';
                inSpan = true;
              } else if (code === "1;36") {
                // Cyan
                if (inSpan) result += "</span>";
                result += '<span class="serial-cyan">';
                inSpan = true;
              } else if (code === "0" || code === "0;0" || code === "") {
                // Reset - close span if one is open
                if (inSpan) {
                  result += "</span>";
                  inSpan = false;
                }
              }
              i = j + 1;
              continue;
            }
          }

          // Regular character
          result += preprocessed[i];
          i++;
        }

        const terminal = document.getElementById("terminal");
        terminal.innerHTML = result;
        terminal.scrollTop = terminal.scrollHeight;
      }

      /**
       * Clear terminal
       */
      function clearTerminal() {
        terminalAnsiBuffer = "";
        const terminal = document.getElementById("terminal");
        terminal.innerHTML = "";
      }

      /**
       * Update system status
       */
      function updateSystemStatus(message, type) {
        const statusElement = document.getElementById("system-status");
        statusElement.textContent = message;
        statusElement.className = "label label-" + type;
      }

      /**
       * Parse GCC output for errors
       */
      function parseGccOutput(output) {
        const errors = [];
        const lines = output.split("\\n");

        for (const line of lines) {
          // Parse GCC error format: filename:line:column: type: message
          const match = line.match(/([^:]+):(\\d+):(\\d+):\\s*(\\w+):\\s*(.+)/);
          if (match) {
            errors.push({
              file: match[1],
              line: parseInt(match[2]),
              column: parseInt(match[3]),
              type: match[4],
              message: match[5],
            });
          }
        }

        return errors;
      }

      /**
       * Show error panel
       */
      function showErrorPanel(errors) {
        const panel = document.getElementById("error-panel");
        const output = document.getElementById("error-output");

        let errorText = "";
        for (const error of errors) {
          errorText += `${error.file}:${error.line}:${error.column}: ${error.type}: ${error.message}\\n`;
        }

        output.textContent = errorText;
        panel.style.display = "block";
      }

      /**
       * Hide error panel
       */
      function hideErrorPanel() {
        document.getElementById("error-panel").style.display = "none";
      }

      /**
       * Update error annotations in editor
       */
      function updateErrorAnnotations(errors) {
        const annotations = errors.map((error) => ({
          row: error.line - 1,
          column: error.column,
          text: error.message,
          type: error.type === "error" ? "error" : "warning",
        }));

        editor.session.setAnnotations(annotations);
      }

      /**
       * Clear error annotations
       */
      function clearErrorAnnotations() {
        editor.session.setAnnotations([]);
      }

      /**
       * Handle missing files
       */
      function handleMissingFiles(missingFiles, fileDetails) {
        updateSystemStatus("缺少系统文件", "danger");

        let message = "以下文件缺失:\n\n";
        missingFiles.forEach((file) => {
          message += "❌ " + file + "\n";
        });

        appendToTerminal(message);

        // Show download instructions
        showDownloadInstructions();
      }

      /**
       * Handle V86 load error
       */
      function handleV86LoadError(error) {
        updateSystemStatus("V86 库加载失败", "danger");
        appendToTerminal("❌ V86 emulator library failed to load\n");
        appendToTerminal("Error: " + error.message + "\n\n");
        appendToTerminal("📋 解决方案:\n");
        appendToTerminal("1. 检查网络连接\n");
        appendToTerminal("2. 下载本地 v86 库到 v86-lib/ 目录\n");
        appendToTerminal("3. 参考 V86_MIGRATION_COMPLETE.md 设置说明\n");
      }

      // Initialize the application when page loads
      window.addEventListener("load", initializeApp);
    </script>
